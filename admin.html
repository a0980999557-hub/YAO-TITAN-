<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YAO TITAN｜網站管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a0d;color:#f4f5f4;font-family:Arial,'Noto Sans TC',sans-serif}.wrap{max-width:1180px;margin:auto;padding:40px 24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{font-weight:900;font-size:28px;letter-spacing:.08em}.brand small{display:block;font-size:10px;color:#d3b06d;letter-spacing:.25em;margin-top:5px}.btn{border:1px solid #555;background:#12161a;color:#fff;padding:12px 18px;border-radius:8px;cursor:pointer;font-size:16px}.btn.primary{background:#d3b06d;color:#080a0d;border-color:#d3b06d;font-weight:800}.btn.danger{border-color:#7a3434;color:#ffb0b0}.login{max-width:430px;margin:14vh auto;padding:36px;border:1px solid #2b3137;border-radius:16px;background:#0d1115}.login h1{font-size:30px}.input,.textarea{width:100%;background:#080a0d;color:#fff;border:1px solid #343b42;border-radius:8px;padding:14px;font-size:17px;margin:7px 0 16px}.textarea{min-height:120px;resize:vertical}.panel{background:#0d1115;border:1px solid #2b3137;border-radius:14px;padding:25px;margin-bottom:20px}.panel h2{margin-top:0;font-size:24px}.panel h3{margin:25px 0 10px;color:#d3b06d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field label,.row label{display:block;color:#b7bec5;font-size:15px;margin-bottom:4px}.row{display:grid;grid-template-columns:130px 1fr 1fr auto;gap:12px;align-items:start;padding:18px 0;border-top:1px solid #252b30}.thumb{width:130px;height:86px;object-fit:cover;border-radius:7px;border:1px solid #343b42}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:25px}.msg{padding:13px 15px;border-radius:8px;background:#131920;margin-bottom:20px;display:none}.muted{color:#899199}.upload{border:1px dashed #555;padding:16px;border-radius:10px}.status{position:sticky;top:10px;z-index:5;padding:10px 14px;background:#111820;border:1px solid #31543b;border-radius:8px;margin-bottom:20px;display:none}.hidden{display:none!important}.hint{font-size:14px;color:#737c84;line-height:1.6}.subpanel{padding:18px;border:1px solid #252b30;border-radius:10px;margin-top:12px}
@media(max-width:750px){.grid{grid-template-columns:1fr}.row{grid-template-columns:90px 1fr}.row .btn{grid-column:2}.thumb{width:90px;height:65px}.wrap{padding:25px 15px}.top{align-items:flex-start}.brand{font-size:22px}}
</style></head><body>
<div id="login" class="login"><div class="brand">YAO TITAN<small>PRECISION TECHNOLOGY</small></div><h1>網站管理後台</h1><p class="muted">修改網站文字、照片與品牌歷程</p><input id="password" class="input" type="password" placeholder="管理密碼" autocomplete="current-password"><button class="btn primary" id="loginBtn" style="width:100%">登入管理後台</button><p id="loginMsg" class="muted"></p></div>
<div id="app" class="wrap hidden"><div class="top"><div class="brand">YAO TITAN<small>WEBSITE CMS</small></div><button class="btn" id="logoutBtn">登出</button></div><div id="status" class="status"></div><div id="msg" class="msg"></div>
<section class="panel"><h2>① 首頁</h2><div class="grid">
<div class="field"><label>小標</label><input id="eyebrow" class="input"></div><div class="field"><label>主標題 1</label><input id="heroTitle1" class="input"></div><div class="field"><label>主標題 2</label><input id="heroTitle2" class="input"></div><div class="field"><label>主標題 3</label><input id="heroTitle3" class="input"></div><div class="field"><label>中文說明第一行</label><input id="heroCopy1" class="input"></div><div class="field"><label>中文說明第二行</label><input id="heroCopy2" class="input"></div><div class="field"><label>按鈕 1</label><input id="heroButton1" class="input"></div><div class="field"><label>按鈕 2</label><input id="heroButton2" class="input"></div></div>
<div class="upload"><b>首頁背景照片</b><p class="hint">選照片後按「上傳並套用」。網站會使用 GitHub 裡的新照片。</p><input id="heroFile" type="file" accept="image/jpeg,image/png,image/webp"> <button class="btn" id="heroUpload">上傳並套用</button> <span id="heroPath" class="muted"></span></div></section>
<section class="panel"><h2>②「我們怎麼做」區塊</h2><div class="grid"><div class="field"><label>英文小標</label><input id="approachEyebrow" class="input"></div><div></div><div class="field"><label>標題第一行</label><input id="approachTitle1" class="input"></div><div class="field"><label>標題第二行</label><input id="approachTitle2" class="input"></div></div><label>內容</label><textarea id="approachBody" class="textarea"></textarea></section>
<section class="panel"><h2>③ 品牌歷程首頁區塊</h2><div class="grid"><div class="field"><label>英文小標</label><input id="heritageEyebrow" class="input"></div><div></div><div class="field"><label>標題第一行</label><input id="heritageTitle1" class="input"></div><div class="field"><label>標題第二行</label><input id="heritageTitle2" class="input"></div></div><label>內容</label><textarea id="heritageBody" class="textarea"></textarea></section>
<section class="panel"><h2>④ 四大核心能力</h2><div class="grid"><div class="field"><label>英文小標</label><input id="capEyebrow" class="input"></div><div class="field"><label>區間文字</label><input id="capRange" class="input"></div><div class="field"><label>標題</label><input id="capTitle" class="input"></div></div><div id="capRows"></div></section>
<section class="panel"><h2>⑤ 真實開發歷程｜照片與文字</h2><p class="hint">每張照片都可以修改標題與說明，也可以換照片。網站上的照片點一下會放大。</p><div class="grid"><div class="field"><label>英文小標</label><input id="galleryEyebrow" class="input"></div><div></div><div class="field"><label>標題</label><input id="galleryTitle" class="input"></div><div class="field"><label>CTA 英文小標</label><input id="galleryCtaEyebrow" class="input"></div><div class="field"><label>CTA 標題</label><input id="galleryCtaTitle" class="input"></div></div><div id="historyRows"></div><button class="btn" id="addHistory">＋ 新增一筆</button></section>
<section class="panel"><h2>⑥ 品牌歷程</h2><div id="timelineRows"></div><button class="btn" id="addTimeline">＋ 新增年份</button></section>
<section class="panel"><h2>⑦ 動力開發</h2><div class="grid"><div class="field"><label>英文小標</label><input id="devEyebrow" class="input"></div><div></div><div class="field"><label>頁面標題</label><input id="devTitle" class="input"></div><div class="field"><label>Lead</label><input id="devLead" class="input"></div></div><label>內容</label><textarea id="devBody" class="textarea"></textarea><h3>開發流程 6 步</h3><div class="grid" id="devSteps"></div></section>
<section class="panel"><h2>⑧ 測試與數據</h2><div class="grid"><div class="field"><label>英文小標</label><input id="testingEyebrow" class="input"></div><div></div><div class="field"><label>頁面標題</label><input id="testingTitle" class="input"></div><div class="field"><label>Lead</label><input id="testingLead" class="input"></div></div><div id="testingRows"></div></section>
<section class="panel"><h2>⑨ 品牌歷程頁</h2><div class="grid"><div class="field"><label>英文小標</label><input id="historyPageEyebrow" class="input"></div><div></div><div class="field"><label>頁面標題</label><input id="historyPageTitle" class="input"></div></div><div id="historyPageImages"></div></section>
<section class="panel"><h2>⑩ 關於曜鈦</h2><div class="grid"><div class="field"><label>英文小標</label><input id="aboutEyebrow" class="input"></div><div></div><div class="field"><label>頁面標題</label><input id="aboutTitle" class="input"></div></div><label>第一段</label><textarea id="about1" class="textarea"></textarea><label>第二段</label><textarea id="about2" class="textarea"></textarea><div class="upload"><b>關於曜鈦照片</b><input id="aboutFile" type="file" accept="image/jpeg,image/png,image/webp"> <button class="btn" id="aboutUpload">上傳並套用</button> <span id="aboutPath" class="muted"></span></div></section>
<section class="panel"><h2>⑪ 技術諮詢</h2><div class="grid"><div class="field"><label>英文小標</label><input id="contactEyebrow" class="input"></div><div></div><div class="field"><label>頁面標題</label><input id="contactTitle" class="input"></div><div class="field"><label>Lead</label><input id="contactLead" class="input"></div></div><label>內容</label><textarea id="contactBody" class="textarea"></textarea></section>
<section class="panel"><h2>⑫ 網站頁尾</h2><div class="grid"><div class="field"><label>左側</label><input id="footerLeft" class="input"></div><div class="field"><label>右側</label><input id="footerRight" class="input"></div></div></section>
<div class="actions"><button class="btn" id="draftBtn">暫存本機草稿</button><button class="btn primary" id="saveBtn">💾 儲存並發佈到網站</button></div>
</div>
<script>
let data=null;const DRAFT='yao-titan-cms-draft-v2';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
function msg(t,bad=false){$('msg').textContent=t;$('msg').style.display='block';$('msg').style.border=bad?'1px solid #7a3434':'1px solid #31543b'}
function status(t){$('status').textContent=t;$('status').style.display='block'}
function set(id,v){if($(id))$(id).value=v??''}
function get(id){return $(id)?.value??''}
function normalize(c){c=c||{};c.site=c.site||{};c.approach=c.approach||{};c.heritage=c.heritage||{};c.capabilities=c.capabilities||{};c.capabilities.items=Array.isArray(c.capabilities.items)?c.capabilities.items:[];c.gallery=c.gallery||{};c.history=Array.isArray(c.history)?c.history:[];c.timeline=Array.isArray(c.timeline)?c.timeline:[];c.development=c.development||{};c.development.steps=Array.isArray(c.development.steps)?c.development.steps:[];c.testing=c.testing||{};c.testing.items=Array.isArray(c.testing.items)?c.testing.items:[];c.historyPage=c.historyPage||{};c.historyPage.images=Array.isArray(c.historyPage.images)?c.historyPage.images:[];c.about=c.about||{};c.contact=c.contact||{};return c}
async function load(){const d=await api('/api/content');data=normalize(d.content);render();try{const draft=localStorage.getItem(DRAFT);if(draft){const parsed=normalize(JSON.parse(draft));data=parsed;render();status('已載入你上次暫存的草稿；確認後按「儲存並發佈到網站」即可。')}}catch(e){}}
function render(){const s=data.site;set('eyebrow',s.eyebrow);set('heroTitle1',s.heroTitle1);set('heroTitle2',s.heroTitle2);set('heroTitle3',s.heroTitle3);set('heroCopy1',s.heroCopy1);set('heroCopy2',s.heroCopy2);set('heroButton1',s.heroButton1);set('heroButton2',s.heroButton2);$('heroPath').textContent='目前：'+(s.heroImage||'');set('footerLeft',s.footerLeft);set('footerRight',s.footerRight);
const a=data.approach;set('approachEyebrow',a.eyebrow);set('approachTitle1',a.title1);set('approachTitle2',a.title2);set('approachBody',a.body);const h=data.heritage;set('heritageEyebrow',h.eyebrow);set('heritageTitle1',h.title1);set('heritageTitle2',h.title2);set('heritageBody',h.body);
const cap=data.capabilities;set('capEyebrow',cap.eyebrow);set('capTitle',cap.title);set('capRange',cap.range);$('capRows').innerHTML=cap.items.map((x,i)=>`<div class="subpanel" data-cap="${i}"><div class="grid"><div><label>英文</label><input class="input cap-en" value="${esc(x.en)}"></div><div><label>中文標題</label><input class="input cap-title" value="${esc(x.title)}"></div></div><label>說明</label><textarea class="textarea cap-body">${esc(x.body)}</textarea></div>`).join('');
const g=data.gallery;set('galleryEyebrow',g.eyebrow);set('galleryTitle',g.title);set('galleryCtaEyebrow',g.ctaEyebrow);set('galleryCtaTitle',g.ctaTitle);renderHistory();renderTimeline();
const d=data.development;set('devEyebrow',d.eyebrow);set('devTitle',d.title);set('devLead',d.lead);set('devBody',d.body);$('devSteps').innerHTML=d.steps.map((x,i)=>`<div><label>步驟 ${String(i+1).padStart(2,'0')}</label><input class="input dev-step" value="${esc(x)}"></div>`).join('');
const t=data.testing;set('testingEyebrow',t.eyebrow);set('testingTitle',t.title);set('testingLead',t.lead);$('testingRows').innerHTML=t.items.map((x,i)=>photoEditor(x,i,'testing')).join('');
const hp=data.historyPage;set('historyPageEyebrow',hp.eyebrow);set('historyPageTitle',hp.title);$('historyPageImages').innerHTML=hp.images.map((x,i)=>`<div class="subpanel"><img class="thumb" src="${esc(x)}"><span class="muted">${esc(x)}</span><input type="file" class="hpi" data-i="${i}" accept="image/jpeg,image/png,image/webp"> <button class="btn hp-upload" data-i="${i}">換照片</button></div>`).join('');
const ab=data.about;set('aboutEyebrow',ab.eyebrow);set('aboutTitle',ab.title);set('about1',ab.p1);set('about2',ab.p2);$('aboutPath').textContent='目前：'+(ab.image||'');const co=data.contact;set('contactEyebrow',co.eyebrow);set('contactTitle',co.title);set('contactLead',co.lead);set('contactBody',co.body);bindDynamic();}
function photoEditor(x,i,type){return `<div class="subpanel" data-${type}="${i}"><div class="row" style="border-top:0"><img class="thumb" src="${esc(x.image)}"><div><label>標題</label><input class="input p-title" value="${esc(x.title)}"><label>說明</label><input class="input p-desc" value="${esc(x.desc)}"></div><div class="upload"><input type="file" class="p-file" accept="image/jpeg,image/png,image/webp"><button class="btn p-upload" data-i="${i}" data-type="${type}">換照片</button></div></div></div>`}
function renderHistory(){$('historyRows').innerHTML=data.history.map((x,i)=>`<div class="subpanel" data-history="${i}"><div class="row" style="border-top:0"><img class="thumb" src="${esc(x.image)}"><div><label>標題</label><input class="input h-title" value="${esc(x.title)}"><label>說明</label><input class="input h-desc" value="${esc(x.desc)}"></div><div class="upload"><input type="file" class="h-file" accept="image/jpeg,image/png,image/webp"><button class="btn h-upload" data-i="${i}">換照片</button></div><button class="btn danger h-remove" data-i="${i}">刪除</button></div></div>`).join('')}
function renderTimeline(){$('timelineRows').innerHTML=data.timeline.map((x,i)=>`<div class="subpanel" data-timeline="${i}"><div class="grid"><div><label>年份</label><input class="input t-year" value="${esc(x.year)}"></div><div><label>標題</label><input class="input t-title" value="${esc(x.title)}"></div></div><label>說明</label><textarea class="textarea t-desc">${esc(x.desc)}</textarea><button class="btn danger t-remove" data-i="${i}">刪除</button></div>`).join('')}
function bindDynamic(){document.querySelectorAll('.h-remove').forEach(b=>b.onclick=()=>{sync();data.history.splice(+b.dataset.i,1);renderHistory();saveDraft()});document.querySelectorAll('.t-remove').forEach(b=>b.onclick=()=>{sync();data.timeline.splice(+b.dataset.i,1);renderTimeline();saveDraft()});document.querySelectorAll('.h-upload').forEach(b=>b.onclick=()=>uploadPhoto('history',+b.dataset.i,b.closest('[data-history]').querySelector('.h-file')));document.querySelectorAll('.p-upload').forEach(b=>b.onclick=()=>uploadPhoto('testing',+b.dataset.i,b.closest('[data-testing]').querySelector('.p-file')));document.querySelectorAll('.hp-upload').forEach(b=>b.onclick=()=>uploadHistoryPage(+b.dataset.i,b.closest('.subpanel').querySelector('.hpi')))}
function sync(){data.site.eyebrow=get('eyebrow');data.site.heroTitle1=get('heroTitle1');data.site.heroTitle2=get('heroTitle2');data.site.heroTitle3=get('heroTitle3');data.site.heroCopy1=get('heroCopy1');data.site.heroCopy2=get('heroCopy2');data.site.heroButton1=get('heroButton1');data.site.heroButton2=get('heroButton2');data.site.footerLeft=get('footerLeft');data.site.footerRight=get('footerRight');data.approach.eyebrow=get('approachEyebrow');data.approach.title1=get('approachTitle1');data.approach.title2=get('approachTitle2');data.approach.body=get('approachBody');data.heritage.eyebrow=get('heritageEyebrow');data.heritage.title1=get('heritageTitle1');data.heritage.title2=get('heritageTitle2');data.heritage.body=get('heritageBody');data.capabilities.eyebrow=get('capEyebrow');data.capabilities.title=get('capTitle');data.capabilities.range=get('capRange');document.querySelectorAll('[data-cap]').forEach((r,i)=>{data.capabilities.items[i].en=r.querySelector('.cap-en').value;data.capabilities.items[i].title=r.querySelector('.cap-title').value;data.capabilities.items[i].body=r.querySelector('.cap-body').value});document.querySelectorAll('[data-history]').forEach((r,i)=>{data.history[i].title=r.querySelector('.h-title').value;data.history[i].desc=r.querySelector('.h-desc').value});document.querySelectorAll('[data-testing]').forEach((r,i)=>{data.testing.items[i].title=r.querySelector('.p-title').value;data.testing.items[i].desc=r.querySelector('.p-desc').value});document.querySelectorAll('[data-timeline]').forEach((r,i)=>{data.timeline[i].year=r.querySelector('.t-year').value;data.timeline[i].title=r.querySelector('.t-title').value;data.timeline[i].desc=r.querySelector('.t-desc').value});data.development.eyebrow=get('devEyebrow');data.development.title=get('devTitle');data.development.lead=get('devLead');data.development.body=get('devBody');data.development.steps=[...document.querySelectorAll('.dev-step')].map(x=>x.value);data.testing.eyebrow=get('testingEyebrow');data.testing.title=get('testingTitle');data.testing.lead=get('testingLead');data.historyPage.eyebrow=get('historyPageEyebrow');data.historyPage.title=get('historyPageTitle');data.about.eyebrow=get('aboutEyebrow');data.about.title=get('aboutTitle');data.about.p1=get('about1');data.about.p2=get('about2');data.contact.eyebrow=get('contactEyebrow');data.contact.title=get('contactTitle');data.contact.lead=get('contactLead');data.contact.body=get('contactBody');}
function saveDraft(){sync();localStorage.setItem(DRAFT,JSON.stringify(data));status('草稿已暫存在這台電腦。')}
async function save(){try{sync();status('正在儲存並發佈…');await api('/api/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:data})});localStorage.removeItem(DRAFT);msg('✅ 已儲存到 GitHub，網站會由 Vercel 自動重新部署。');status('已發佈。');}catch(e){saveDraft();msg('❌ 發佈失敗，但你的內容已暫存在本機草稿，不會消失。\n'+e.message,true)}}
async function upload(file){if(!file)throw new Error('請先選擇照片');const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});return api('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:file.name,base64:b64})})}
async function uploadPhoto(type,i,input){try{sync();const d=await upload(input.files[0]);if(type==='history')data.history[i].image=d.path;else data.testing.items[i].image=d.path;render();await save()}catch(e){msg(e.message,true)}}
async function uploadHistoryPage(i,input){try{sync();const d=await upload(input.files[0]);data.historyPage.images[i]=d.path;render();await save()}catch(e){msg(e.message,true)}}
async function uploadHero(){try{sync();const d=await upload($('heroFile').files[0]);data.site.heroImage=d.path;$('heroPath').textContent='目前：'+d.path;await save()}catch(e){msg(e.message,true)}}
async function uploadAbout(){try{sync();const d=await upload($('aboutFile').files[0]);data.about.image=d.path;$('aboutPath').textContent='目前：'+d.path;await save()}catch(e){msg(e.message,true)}}
$('loginBtn').onclick=async()=>{try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('loginMsg').textContent=e.message}};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('logoutBtn').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.reload()};$('saveBtn').onclick=save;$('draftBtn').onclick=saveDraft;$('heroUpload').onclick=uploadHero;$('aboutUpload').onclick=uploadAbout;
$('addHistory').onclick=()=>{sync();data.history.push({image:'history/01.jpg',title:'新開發紀錄',desc:'請輸入照片說明'});renderHistory();bindDynamic();saveDraft()};$('addTimeline').onclick=()=>{sync();data.timeline.push({year:'2026',title:'新的開發階段',desc:'請輸入內容'});renderTimeline();bindDynamic();saveDraft()};
api('/api/me').then(d=>{if(d.authenticated){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}}).catch(()=>{});
</script></body></html>
