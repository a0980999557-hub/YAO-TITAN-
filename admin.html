<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YAO TITAN｜網站管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a0d;color:#f4f5f4;font-family:Arial,'Noto Sans TC',sans-serif}.wrap{max-width:1180px;margin:auto;padding:40px 24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{font-weight:900;font-size:28px;letter-spacing:.08em}.brand small{display:block;font-size:10px;color:#d3b06d;letter-spacing:.25em;margin-top:5px}.btn{border:1px solid #555;background:#12161a;color:#fff;padding:12px 18px;border-radius:8px;cursor:pointer;font-size:16px}.btn.primary{background:#d3b06d;color:#080a0d;border-color:#d3b06d;font-weight:800}.login{max-width:430px;margin:14vh auto;padding:36px;border:1px solid #2b3137;border-radius:16px;background:#0d1115}.login h1{font-size:30px}.input,.textarea{width:100%;background:#080a0d;color:#fff;border:1px solid #343b42;border-radius:8px;padding:14px;font-size:17px;margin:8px 0 18px}.textarea{min-height:110px;resize:vertical}.panel{background:#0d1115;border:1px solid #2b3137;border-radius:14px;padding:25px;margin-bottom:20px}.panel h2{margin-top:0;font-size:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field label{display:block;color:#b7bec5;font-size:15px;margin-bottom:5px}.row{display:grid;grid-template-columns:120px 1fr 1fr auto;gap:10px;align-items:start;padding:15px 0;border-top:1px solid #252b30}.thumb{width:120px;height:80px;object-fit:cover;border-radius:7px;border:1px solid #343b42}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:25px}.msg{padding:12px 15px;border-radius:8px;background:#131920;margin-bottom:20px;display:none}.muted{color:#899199}.upload{border:1px dashed #555;padding:20px;border-radius:10px}.danger{color:#ff8b8b}.hidden{display:none!important}@media(max-width:750px){.grid{grid-template-columns:1fr}.row{grid-template-columns:90px 1fr}.row .btn{grid-column:2}.thumb{width:90px;height:65px}.wrap{padding:25px 15px}.top{align-items:flex-start}.brand{font-size:22px}}
</style></head><body>
<div id="login" class="login"><div class="brand">YAO TITAN<small>PRECISION TECHNOLOGY</small></div><h1>網站管理後台</h1><p class="muted">請輸入管理密碼</p><input id="password" class="input" type="password" placeholder="管理密碼" autocomplete="current-password"><button class="btn primary" style="width:100%" onclick="login()">登入管理後台</button><p id="loginMsg" class="danger"></p></div>
<div id="app" class="wrap hidden"><div class="top"><div class="brand">YAO TITAN<small>WEBSITE CMS</small></div><button class="btn" onclick="logout()">登出</button></div><div id="msg" class="msg"></div>
<div class="panel"><h2>首頁內容</h2><div class="grid"><div class="field"><label>小標</label><input id="eyebrow" class="input"></div><div class="field"><label>主標題 1</label><input id="heroTitle1" class="input"></div><div class="field"><label>主標題 2</label><input id="heroTitle2" class="input"></div><div class="field"><label>主標題 3</label><input id="heroTitle3" class="input"></div><div class="field"><label>中文說明第一行</label><input id="heroCopy1" class="input"></div><div class="field"><label>中文說明第二行</label><input id="heroCopy2" class="input"></div></div><div class="upload"><b>首頁背景照片</b><p class="muted">上傳後會先存進 GitHub，網站重新部署後生效</p><input id="heroFile" type="file" accept="image/jpeg,image/png,image/webp"><button class="btn" onclick="uploadHero()">上傳並套用</button><span id="heroPath" class="muted"></span></div></div>
<div class="panel"><h2>真實開發歷程｜照片與文字</h2><p class="muted">這裡就是你之後最常用的地方。每張照片的標題、說明都可以自己修改。</p><div id="historyRows"></div><button class="btn" onclick="addHistory()">＋ 新增一筆</button></div>
<div class="panel"><h2>品牌歷程</h2><div id="timelineRows"></div><button class="btn" onclick="addTimeline()">＋ 新增年份</button></div>
<div class="panel"><h2>關於曜鈦</h2><textarea id="about1" class="textarea"></textarea><textarea id="about2" class="textarea"></textarea></div>
<div class="panel"><h2>技術諮詢</h2><input id="contactLead" class="input"><textarea id="contactBody" class="textarea"></textarea></div>
<div class="actions"><button class="btn primary" onclick="save()">💾 儲存全部修改</button></div></div>
<script>
let data=null;
const $=id=>document.getElementById(id);
async function api(url,opt){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw new Error(d.error||'操作失敗');return d}
async function check(){try{const d=await api('/api/me');if(d.authenticated){$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}}catch(e){}}
async function login(){try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('loginMsg').textContent='';$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('loginMsg').textContent=e.message}}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){const d=await api('/api/content');data=d.content;$('eyebrow').value=data.site.eyebrow;$('heroTitle1').value=data.site.heroTitle1;$('heroTitle2').value=data.site.heroTitle2;$('heroTitle3').value=data.site.heroTitle3;$('heroCopy1').value=data.site.heroCopy1;$('heroCopy2').value=data.site.heroCopy2;$('heroPath').textContent='目前：'+data.site.heroImage;$('about1').value=data.about.p1;$('about2').value=data.about.p2;$('contactLead').value=data.contact.lead;$('contactBody').value=data.contact.body;renderHistory();renderTimeline()}
function renderHistory(){ $('historyRows').innerHTML=data.history.map((x,i)=>`<div class="row" data-i="${i}"><img class="thumb" src="${esc(x.image)}"><div><label>標題</label><input class="input ht" value="${esc(x.title)}"><label>說明</label><input class="input hd" value="${esc(x.desc)}"></div><div class="upload"><input type="file" class="hf" accept="image/jpeg,image/png,image/webp"><button class="btn" onclick="uploadHistory(${i})">換照片</button></div><button class="btn" onclick="removeHistory(${i})">刪除</button></div>`).join('')}
function renderTimeline(){ $('timelineRows').innerHTML=data.timeline.map((x,i)=>`<div class="row" data-ti="${i}"><input class="input ty" value="${esc(x.year)}"><div><input class="input tt" value="${esc(x.title)}"><textarea class="textarea td">${esc(x.desc)}</textarea></div><div></div><button class="btn" onclick="removeTimeline(${i})">刪除</button></div>`).join('')}
function sync(){document.querySelectorAll('#historyRows .row').forEach((r,i)=>{data.history[i].title=r.querySelector('.ht').value;data.history[i].desc=r.querySelector('.hd').value});document.querySelectorAll('#timelineRows .row').forEach((r,i)=>{data.timeline[i].year=r.querySelector('.ty').value;data.timeline[i].title=r.querySelector('.tt').value;data.timeline[i].desc=r.querySelector('.td').value});data.site.eyebrow=$('eyebrow').value;data.site.heroTitle1=$('heroTitle1').value;data.site.heroTitle2=$('heroTitle2').value;data.site.heroTitle3=$('heroTitle3').value;data.site.heroCopy1=$('heroCopy1').value;data.site.heroCopy2=$('heroCopy2').value;data.about.p1=$('about1').value;data.about.p2=$('about2').value;data.contact.lead=$('contactLead').value;data.contact.body=$('contactBody').value}
async function save(){try{sync();await api('/api/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:data})});showMsg('已儲存！Vercel 會自動重新部署，通常幾分鐘內更新網站。');}catch(e){showMsg(e.message,true)}}
async function upload(file){const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});return api('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:file.name,base64:b64})})}
async function uploadHistory(i){try{sync();const file=document.querySelectorAll('.hf')[i].files[0];if(!file)return showMsg('請先選擇照片',true);const d=await upload(file);data.history[i].image=d.path;renderHistory();await save()}catch(e){showMsg(e.message,true)}}
async function uploadHero(){try{const file=$('heroFile').files[0];if(!file)return showMsg('請先選擇照片',true);const d=await upload(file);data.site.heroImage=d.path;$('heroPath').textContent='目前：'+d.path;await save()}catch(e){showMsg(e.message,true)}}
function addHistory(){data.history.push({image:'history/01.jpg',title:'新開發紀錄',desc:'請輸入這張照片對應的說明'});renderHistory()}
function removeHistory(i){data.history.splice(i,1);renderHistory()}
function addTimeline(){data.timeline.push({year:'2026',title:'新的開發階段',desc:'請輸入內容'});renderTimeline()}
function removeTimeline(i){data.timeline.splice(i,1);renderTimeline()}
function showMsg(t,bad=false){$('msg').textContent=t;$('msg').style.display='block';$('msg').style.border=bad?'1px solid #7a3434':'1px solid #31543b';setTimeout(()=>{$('msg').style.display='none'},5000)}
check();
</script></body></html>
