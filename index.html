<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAO-TITAN 曜鈦精密科技 | 動力解封，顛覆極限</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #050505; color: #fff; scroll-behavior: smooth; overflow-x: hidden; }
        .gold-glow { text-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
        .titan-gradient { background: linear-gradient(to bottom, #FFD700, #B8860B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-nav { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 215, 0, 0.15); }
        .panel-gold { background: #111; border: 1px solid rgba(255, 215, 0, 0.1); }
        .btn-titan { background: linear-gradient(to right, #ca8a04, #eab308); color: black; font-weight: 900; box-shadow: 0 10px 30px rgba(202, 138, 4, 0.3); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 glass-nav h-24 flex items-center justify-between px-10">
        <div class="flex items-center gap-4 cursor-pointer" onclick="renderPage('home')">
            <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" class="h-16 drop-shadow-[0_0_15px_rgba(255,215,0,0.5)]">
            <span class="text-2xl font-black tracking-[0.2em] titan-gradient hidden lg:block uppercase">曜鈦精密科技</span>
        </div>
        <div class="hidden lg:flex items-center space-x-12 text-sm font-bold tracking-[0.3em] text-gray-400">
            <button onclick="renderPage('brand')" class="hover:text-yellow-500 transition-all">霸主起源</button>
            <button onclick="renderPage('products')" class="hover:text-yellow-500 transition-all">神級改裝品</button>
            <button onclick="renderPage('tech')" class="hover:text-yellow-500 transition-all">黑科技支持</button>
            <button onclick="renderPage('contact')" class="hover:text-yellow-500 transition-all">聯絡我們</button>
        </div>
        <div class="flex items-center gap-6">
            <button onclick="toggleCart(true)" class="relative text-yellow-500"><i data-lucide="shopping-bag" size="28"></i><span id="cart-badge" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-black hidden">0</span></button>
            <button onclick="adminLogin()" class="text-gray-700 hover:text-yellow-500"><i data-lucide="settings" size="22"></i></button>
        </div>
    </nav>

    <main id="main-view" class="pt-24 min-h-screen"></main>

    <div id="cart-drawer" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="toggleCart(false)"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-md bg-neutral-900 border-l border-yellow-600/30 p-10 flex flex-col">
            <div class="flex justify-between items-center mb-10 text-yellow-500"><h2 class="text-3xl font-black italic tracking-tighter">SHOPPING BAG</h2><button onclick="toggleCart(false)"><i data-lucide="x"></i></button></div>
            <div id="cart-list" class="flex-grow overflow-y-auto space-y-6"></div>
            <div class="border-t border-white/10 pt-10">
                <div class="flex justify-between text-2xl font-black mb-8"><span>總計</span><span id="cart-total" class="text-yellow-500">NT$ 0</span></div>
                <button class="w-full py-5 btn-titan text-xl italic tracking-[0.2em]">前往結帳，解除封印</button>
            </div>
        </div>
    </div>

    <footer class="bg-black py-24 border-t border-white/5 text-center px-10">
        <p class="text-gray-600 text-xs tracking-[0.5em] uppercase">© 2026 YAO-TITAN PRECISION TECHNOLOGY. ALL RIGHTS RESERVED.</p>
        <div class="mt-6 text-yellow-900 font-black italic tracking-widest text-lg">研發監製：噗馬哥總裁</div>
    </footer>

    <script>
        // --- 核心資料 ---
        let state = {
            currentPage: 'home',
            isAdmin: false,
            cart: [],
            categories: ['凸輪軸', '鍛造活塞', '前普利盤', '傳動離合器'],
            products: [
                { id: 1, name: '賽道狂飆級 高角度凸輪軸', price: 12800, category: '凸輪軸', model: '勁戰六代 / 水冷BWS', stock: 15, sales: 128, image: 'https://images.unsplash.com/photo-1558981403-c5f11bbdba27?auto=format&fit=crop&q=80&w=800' },
                { id: 2, name: 'T6航太級 鍛造輕量活塞', price: 8500, category: '鍛造活塞', model: 'DRG 158 / MMBCU', stock: 0, sales: 85, image: 'https://images.unsplash.com/photo-1611039801831-28562d4e78a2?auto=format&fit=crop&q=80&w=800' },
                { id: 3, name: '秒殺起步 前普利盤套件', price: 4200, category: '前普利盤', model: 'KRV 180', stock: 20, sales: 310, image: 'https://images.unsplash.com/photo-1589118949245-7d38baf380d6?auto=format&fit=crop&q=80&w=800' },
                { id: 4, name: '暴力咬合 傳動離合器總成', price: 5800, category: '傳動離合器', model: '全車系通用', stock: 5, sales: 240, image: 'https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&q=80&w=800' }
            ]
        };

        // --- 渲染引擎 ---
        function renderPage(page) {
            state.currentPage = page;
            const view = document.getElementById('main-view');
            window.scrollTo(0, 0);

            if (page === 'home') {
                view.innerHTML = `
                    <section class="min-h-screen flex flex-col items-center justify-center text-center px-6 relative animate-in">
                        <div class="mb-14 relative">
                            <div class="absolute inset-0 blur-[80px] bg-yellow-600/20 rounded-full"></div>
                            <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" class="w-72 h-72 object-contain relative z-10 drop-shadow-[0_0_50px_rgba(255,215,0,0.4)]">
                        </div>
                        <h2 class="text-xl font-bold tracking-[1.2em] text-yellow-600 mb-10 uppercase gold-glow">Precision Engineering</h2>
                        <h1 class="text-7xl md:text-[140px] font-black mb-6 leading-none tracking-tighter text-white">動力解封</h1>
                        <h1 class="text-4xl md:text-8xl font-black titan-gradient mb-16 italic tracking-tighter">顛覆業界的極致效能</h1>
                        <p class="text-xl md:text-2xl text-gray-400 max-w-4xl mx-auto mb-20 leading-relaxed font-light">換上<span class="text-yellow-500 font-black">曜鈦精密</span>，您的座駕就是公路上的神級外掛。</p>
                        <button onclick="renderPage('products')" class="px-20 py-7 btn-titan text-2xl tracking-[0.3em]">解鎖神裝清單</button>
                    </section>
                `;
            } else if (page === 'products') {
                renderProducts();
            } else {
                view.innerHTML = `<div class="py-60 text-center text-5xl font-black titan-gradient uppercase tracking-widest">${page.toUpperCase()} 頁面開發中</div>`;
            }
            lucide.createIcons();
        }

        function renderProducts() {
            const view = document.getElementById('main-view');
            let adminSection = state.isAdmin ? `
                <div class="mb-20 space-y-10">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                        <div class="p-10 panel-gold rounded-[2.5rem] shadow-2xl border-yellow-500/40">
                            <p class="text-gray-500 font-black text-sm uppercase tracking-widest mb-2">本月累積預估營收</p>
                            <p class="text-6xl font-black text-white">NT$ ${(state.products.reduce((acc, p) => acc + (p.price * Math.floor(p.sales * 0.1)), 0) + 1250000).toLocaleString()}</p>
                        </div>
                        <div class="p-10 panel-gold rounded-[2.5rem] shadow-2xl border-yellow-500/40">
                            <p class="text-gray-500 font-black text-sm uppercase tracking-widest mb-2">年度總計實收額</p>
                            <p class="text-6xl font-black text-white">NT$ ${(state.products.reduce((acc, p) => acc + (p.price * p.sales), 0) + 15800000).toLocaleString()}</p>
                        </div>
                    </div>
                </div>
            ` : '';

            view.innerHTML = `
                <div class="max-w-7xl mx-auto px-10 py-24 text-left">
                    <h2 class="text-6xl font-black italic tracking-tighter mb-12 uppercase">神級改裝品 <span class="titan-gradient tracking-widest">CORE SERIES</span></h2>
                    ${adminSection}
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                        ${state.products.map(p => `
                            <div class="panel-gold rounded-[3rem] overflow-hidden group hover:border-yellow-500/50 transition-all duration-500 flex flex-col shadow-xl">
                                <div class="aspect-square relative overflow-hidden bg-black">
                                    <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-1000">
                                    <div class="absolute inset-0 bg-black/70 opacity-0 group-hover:opacity-100 flex items-center justify-center p-10 transition-all">
                                        <button onclick="buyProduct(${p.id})" class="w-full py-5 ${p.stock > 0 ? 'bg-yellow-600 text-black' : 'bg-red-700 text-white'} font-black text-xl rounded-2xl">
                                            ${p.stock > 0 ? '解鎖加入購物車' : '到貨自動通知'}
                                        </button>
                                    </div>
                                </div>
                                <div class="p-10 flex-grow text-left">
                                    <span class="text-xs font-black text-yellow-600 bg-yellow-600/10 px-3 py-1 rounded-sm uppercase tracking-widest">${p.category}</span>
                                    <h3 class="text-2xl font-black text-white mt-4 mb-4 line-clamp-2 h-16">${p.name}</h3>
                                    <p class="text-gray-500 text-sm font-bold mb-8 uppercase tracking-widest">適配機種：${p.model}</p>
                                    <p class="text-3xl font-black text-yellow-500 font-mono tracking-tighter uppercase">NT$ ${p.price.toLocaleString()}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // --- 功能邏輯 ---
        function buyProduct(id) {
            const p = state.products.find(x => x.id === id);
            if (p.stock <= 0) return alert('系統已記錄！補貨時將通知您。');
            state.cart.push({ ...p, cartId: Date.now() });
            updateCart();
            toggleCart(true);
        }

        function updateCart() {
            const list = document.getElementById('cart-list');
            const total = document.getElementById('cart-total');
            const badge = document.getElementById('cart-badge');
            badge.innerText = state.cart.length;
            badge.classList.toggle('hidden', state.cart.length === 0);
            list.innerHTML = state.cart.length === 0 ? `<div class="py-20 text-center text-gray-600 font-black italic uppercase">Bag is Empty</div>` :
                state.cart.map(i => `
                    <div class="flex gap-6 bg-white/5 p-5 rounded-[1.5rem] items-center border border-white/5">
                        <img src="${i.image}" class="w-20 h-20 object-cover rounded-xl border border-white/10">
                        <div class="flex-grow text-left">
                            <h4 class="font-bold text-sm text-white">${i.name}</h4>
                            <p class="text-yellow-600 font-black text-lg mt-2">NT$ ${i.price.toLocaleString()}</p>
                        </div>
                        <button onclick="removeFromCart(${i.cartId})" class="text-gray-600 hover:text-red-500"><i data-lucide="trash-2"></i></button>
                    </div>
                `).join('');
            total.innerText = `NT$ ${state.cart.reduce((s, i) => s + i.price, 0).toLocaleString()}`;
            lucide.createIcons();
        }

        function removeFromCart(cid) { state.cart = state.cart.filter(x => x.cartId !== cid); updateCart(); }
        function toggleCart(show) { document.getElementById('cart-drawer').classList.toggle('hidden', !show); }

        function adminLogin() {
            const pass = prompt('【曜鈦精密 戰情中心驗證】\n請輸入管理員授權密碼：');
            if (pass === 'Aeon.1388') {
                state.isAdmin = true;
                alert('噗馬哥總裁，歡迎登入戰情中心！');
                renderPage('products');
            } else if (pass !== null) {
                alert('密碼錯誤！');
            }
        }

        window.onload = () => renderPage('home');
    </script>
</body>
</html>
