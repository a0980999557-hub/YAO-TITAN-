<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAO-TITAN 曜鈦精密科技 | 總裁戰情中心系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0a0a0a; color: #eee; scroll-behavior: smooth; }
        .titan-gold { color: #FFD700; }
        .bg-titan-gold { background: linear-gradient(135deg, #ca8a04, #ffdf00); }
        .glass-panel { background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .hidden { display: none !important; }
        .admin-glow { box-shadow: 0 0 20px rgba(202, 138, 4, 0.2); border-color: rgba(202, 138, 4, 0.5); }
    </style>
</head>
<body class="pb-safe">

    <nav class="fixed top-0 w-full z-50 bg-black/90 backdrop-blur-md border-b border-white/10 h-24 flex items-center justify-between px-8">
        <div class="flex items-center gap-4 cursor-pointer group" onclick="navigate('home')">
            <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" class="h-14 drop-shadow-[0_0_8px_rgba(255,215,0,0.5)]">
            <span class="text-2xl font-black tracking-widest bg-gradient-to-r from-yellow-500 to-yellow-200 bg-clip-text text-transparent hidden sm:block">曜鈦精密科技</span>
        </div>

        <div class="hidden lg:flex space-x-2">
            <button onclick="navigate('brand')" class="nav-item px-4 py-2 text-gray-400 hover:text-white uppercase tracking-widest">霸主起源</button>
            <button onclick="navigate('products')" class="nav-item px-4 py-2 text-gray-400 hover:text-white uppercase tracking-widest">神級改裝品</button>
            <button onclick="navigate('tech')" class="nav-item px-4 py-2 text-gray-400 hover:text-white uppercase tracking-widest">黑科技支持</button>
            <button onclick="navigate('contact')" class="nav-item px-4 py-2 text-gray-400 hover:text-white uppercase tracking-widest">聯絡我們</button>
        </div>

        <div class="flex items-center gap-6">
            <button onclick="toggleCart(true)" class="relative text-yellow-500 p-2 hover:bg-white/10 rounded-full">
                <i data-lucide="shopping-bag"></i>
                <span id="cart-badge" class="absolute top-0 right-0 bg-red-600 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-black hidden">0</span>
            </button>
            <button onclick="toggleAdminLogin(true)" id="admin-btn" class="text-gray-500 hover:text-yellow-500"><i data-lucide="settings"></i></button>
        </div>
    </nav>

    <main id="app-root" class="pt-24 min-h-screen">
        </main>

    <footer class="bg-black border-t border-white/10 pt-20 pb-10 mt-20">
        <div class="max-w-7xl mx-auto px-8 grid grid-cols-1 md:grid-cols-4 gap-12 text-left">
            <div class="col-span-1 md:col-span-2">
                <h4 class="text-white font-black text-xl mb-4">曜鈦精密科技 (YAO-TI)</h4>
                <p class="text-gray-500 text-sm leading-relaxed">注入賽道靈魂，解鎖動力封印。<br>我們為您淬鍊神級外掛！</p>
            </div>
            <div>
                <h4 class="text-yellow-500 font-bold mb-6">技術支援</h4>
                <p class="text-gray-400 text-sm">Line: a0980999557</p>
                <p class="text-gray-400 text-sm">Email: yaotitascand@gmail.com</p>
            </div>
            <div>
                <h4 class="text-yellow-500 font-bold mb-6">快捷服務</h4>
                <button onclick="logoutAdmin()" id="logout-btn" class="text-gray-400 text-sm hidden hover:text-red-500">登出戰情室</button>
                <p class="text-gray-400 text-sm">© 2026 曜鈦精密</p>
            </div>
        </div>
    </footer>

    <div id="login-modal" class="fixed inset-0 z-[110] bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-neutral-900 border border-yellow-500/30 p-8 rounded-2xl w-full max-w-sm">
            <h3 class="text-2xl font-black mb-6 text-center text-yellow-500">總裁專屬後台登入</h3>
            <input type="password" id="admin-pass" placeholder="請輸入管理員密碼" class="w-full bg-black border border-white/20 rounded-xl px-4 py-3 mb-6 outline-none focus:border-yellow-500 text-white">
            <div class="flex gap-4">
                <button onclick="toggleAdminLogin(false)" class="flex-1 py-3 bg-white/10 rounded-xl font-bold">取消</button>
                <button onclick="processLogin()" class="flex-1 py-3 bg-yellow-600 text-black font-black rounded-xl">登入解鎖</button>
            </div>
        </div>
    </div>

    <div id="cart-drawer" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="toggleCart(false)"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-md bg-neutral-900 shadow-2xl flex flex-col border-l border-white/10">
            <div class="p-8 border-b border-white/10 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-yellow-500 flex items-center gap-2"><i data-lucide="shopping-bag"></i> 購物車清單</h2>
                <button onclick="toggleCart(false)" class="hover:rotate-90 transition-all p-2 bg-white/5 rounded-full"><i data-lucide="x"></i></button>
            </div>
            <div id="cart-items-list" class="flex-grow overflow-y-auto p-8 space-y-4"></div>
            <div class="p-8 bg-black/50 border-t border-white/10">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-gray-400">總計金額</span>
                    <span id="cart-total-price" class="text-3xl font-black text-yellow-500">NT$ 0</span>
                </div>
                <button class="w-full bg-yellow-600 text-black py-4 rounded-xl font-black text-lg shadow-lg">結帳，解除封印！</button>
            </div>
        </div>
    </div>

    <script>
        // 1. 初始化資料
        let state = {
            currentPage: 'home',
            isAdmin: false,
            categories: ['凸輪軸', '鍛造活塞', '前普利盤', '傳動離合器'],
            products: [
                { id: 1, name: '賽道狂飆級 高角度凸輪軸', price: 12800, image: 'https://images.unsplash.com/photo-1558981403-c5f11bbdba27?auto=format&fit=crop&q=80&w=800', category: '凸輪軸', model: '勁戰六代 / 水冷BWS', stock: 15, sales: 128 },
                { id: 2, name: 'T6航太級 鍛造輕量活塞', price: 8500, image: 'https://images.unsplash.com/photo-1611039801831-28562d4e78a2?auto=format&fit=crop&q=80&w=800', category: '鍛造活塞', model: 'DRG 158 / MMBCU', stock: 0, sales: 85 },
                { id: 3, name: '秒殺起步 前普利盤套件', price: 4200, image: 'https://images.unsplash.com/photo-1589118949245-7d38baf380d6?auto=format&fit=crop&q=80&w=800', category: '前普利盤', model: 'KRV 180', stock: 20, sales: 310 },
                { id: 4, name: '暴力咬合 傳動離合器總成', price: 5800, image: 'https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&q=80&w=800', category: '傳動離合器', model: '全車系通用', stock: 5, sales: 240 }
            ],
            cart: [],
            selectedCategory: '全部'
        };

        // 2. 路由控制
        function navigate(pageId) {
            state.currentPage = pageId;
            render();
            window.scrollTo(0, 0);
        }

        // 3. 核心渲染器
        function render() {
            const root = document.getElementById('app-root');
            
            if (state.currentPage === 'home') {
                root.innerHTML = `
                    <section class="max-w-7xl mx-auto px-6 py-24 text-center animate-in fade-in duration-700">
                        <div class="inline-flex items-center gap-2 px-5 py-2 bg-yellow-500/10 border border-yellow-500/30 rounded-full text-xs font-bold text-yellow-500 mb-8 tracking-widest uppercase">
                           <i data-lucide="zap" class="w-4 h-4"></i> 賽道級黑科技全面釋放
                        </div>
                        <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" class="h-48 mx-auto mb-8 drop-shadow-2xl">
                        <h1 class="text-6xl md:text-8xl font-black mb-8 text-white">動力解封<br><span class="bg-gradient-to-r from-yellow-500 to-yellow-200 bg-clip-text text-transparent tracking-tighter">顛覆業界的極致效能</span></h1>
                        <p class="text-xl text-gray-400 max-w-2xl mx-auto mb-12">換上曜鈦精密，您的座駕就是公路上的神級外掛！</p>
                        <button onclick="navigate('products')" class="px-12 py-5 bg-yellow-600 text-black font-black text-xl rounded-full shadow-xl shadow-yellow-500/20 hover:scale-105 transition-all">解鎖神裝清單</button>
                    </section>
                `;
            } else if (state.currentPage === 'products') {
                renderProductsPage(root);
            } else if (state.currentPage === 'brand') {
                root.innerHTML = `<div class="py-40 text-center text-4xl font-black uppercase tracking-widest border-l-8 border-yellow-500 mx-10">霸主起源 探索中...</div>`;
            } else if (state.currentPage === 'tech') {
                root.innerHTML = `<div class="py-40 text-center text-4xl font-black uppercase tracking-widest border-l-8 border-yellow-500 mx-10">黑科技 支持解析中...</div>`;
            } else if (state.currentPage === 'contact') {
                root.innerHTML = `<div class="py-40 text-center text-4xl font-black uppercase tracking-widest border-l-8 border-yellow-500 mx-10">聯絡我們 準備中...</div>`;
            }
            
            updateCartUI();
            lucide.createIcons();
        }

        // 4. 產品頁面渲染 (包含總裁管理介面)
        function renderProductsPage(root) {
            let adminHTML = '';
            if (state.isAdmin) {
                const monthRev = state.products.reduce((acc, p) => acc + (p.price * Math.floor(p.sales * 0.1)), 0) + 1250000;
                const yearRev = state.products.reduce((acc, p) => acc + (p.price * p.sales), 0) + 15800000;
                
                adminHTML = `
                    <div class="mb-16 space-y-8">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="glass-panel p-8 rounded-3xl border-yellow-500/30 flex items-center gap-6 admin-glow">
                                <div class="p-4 bg-yellow-500/10 text-yellow-500 rounded-2xl"><i data-lucide="bar-chart-3" size="32"></i></div>
                                <div><p class="text-gray-400 font-bold text-sm tracking-widest uppercase">本月累積營收</p><p class="text-4xl font-black text-white">NT$ ${monthRev.toLocaleString()}</p></div>
                            </div>
                            <div class="glass-panel p-8 rounded-3xl border-yellow-500/30 flex items-center gap-6 admin-glow">
                                <div class="p-4 bg-yellow-500/10 text-yellow-500 rounded-2xl"><i data-lucide="trending-up" size="32"></i></div>
                                <div><p class="text-gray-400 font-bold text-sm tracking-widest uppercase">年度總計營收</p><p class="text-4xl font-black text-white">NT$ ${yearRev.toLocaleString()}</p></div>
                            </div>
                        </div>

                        <div class="glass-panel p-8 rounded-3xl text-left">
                            <h3 class="text-xl font-black text-yellow-500 mb-6 flex items-center gap-2"><i data-lucide="wrench"></i> 總裁管理後台</h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                <input id="new-p-name" placeholder="產品名稱" class="bg-black border border-white/10 p-4 rounded-xl outline-none focus:border-yellow-500">
                                <input id="new-p-price" type="number" placeholder="價格" class="bg-black border border-white/10 p-4 rounded-xl outline-none focus:border-yellow-500">
                                <input id="new-p-model" placeholder="適配機種" class="bg-black border border-white/10 p-4 rounded-xl outline-none focus:border-yellow-500">
                            </div>
                            <button onclick="addNewProduct()" class="w-full py-4 bg-yellow-600 text-black font-black rounded-xl hover:bg-yellow-500 transition-all">確認上架神裝</button>
                        </div>
                    </div>
                `;
            }

            const filteredProducts = state.selectedCategory === '全部' ? state.products : state.products.filter(p => p.category === state.selectedCategory);

            root.innerHTML = `
                <div class="max-w-7xl mx-auto px-8 py-20 text-left">
                    <h2 class="text-5xl font-black mb-12">神級改裝品清單</h2>
                    ${adminHTML}
                    
                    <div class="flex flex-wrap gap-4 mb-12">
                        <button onclick="filterCat('全部')" class="px-6 py-2 rounded-full border ${state.selectedCategory==='全部'?'bg-yellow-500 text-black border-yellow-500':'border-white/20 text-gray-400'}">全部</button>
                        ${state.categories.map(cat => `<button onclick="filterCat('${cat}')" class="px-6 py-2 rounded-full border ${state.selectedCategory===cat?'bg-yellow-500 text-black border-yellow-500':'border-white/20 text-gray-400'}">${cat}</button>`).join('')}
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                        ${filteredProducts.map(p => `
                            <div class="glass-panel rounded-[2rem] overflow-hidden flex flex-col h-full hover:border-yellow-500/50 transition-all duration-500 group">
                                <div class="aspect-video relative overflow-hidden bg-black">
                                    <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-700">
                                    <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-all p-6">
                                        <button onclick="${p.stock > 0 ? `buyProduct(${p.id})` : `alert('已設定貨到通知！')`}" class="w-full py-4 ${p.stock > 0 ? 'bg-yellow-500 text-black' : 'bg-red-600 text-white'} font-black rounded-xl">
                                            ${p.stock > 0 ? '解鎖加入購物車' : '到貨自動通知'}
                                        </button>
                                    </div>
                                </div>
                                <div class="p-8 flex-grow">
                                    <h3 class="font-bold text-xl mb-2 text-white">${p.name}</h3>
                                    <p class="text-gray-500 text-sm mb-4">適配機種：${p.model}</p>
                                    <div class="flex justify-between items-end mt-auto">
                                        <p class="text-2xl font-black text-yellow-500">NT$ ${p.price.toLocaleString()}</p>
                                        ${state.isAdmin ? `<button onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-400"><i data-lucide="trash-2" size="20"></i></button>` : ''}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // 5. 業務邏輯功能
        function filterCat(cat) { state.selectedCategory = cat; render(); }

        function buyProduct(id) {
            const p = state.products.find(x => x.id === id);
            state.cart.push({ ...p, cartId: Date.now() });
            toggleCart(true);
            updateCartUI();
        }

        function toggleCart(show) { document.getElementById('cart-drawer').classList.toggle('hidden', !show); }

        function updateCartUI() {
            const list = document.getElementById('cart-items-list');
            const total = document.getElementById('cart-total-price');
            const badge = document.getElementById('cart-badge');
            
            badge.innerText = state.cart.length;
            badge.classList.toggle('hidden', state.cart.length === 0);
            
            list.innerHTML = state.cart.length === 0 ? `<div class="py-20 text-center text-gray-500">購物袋空空如也</div>` :
                state.cart.map(item => `
                    <div class="flex gap-4 bg-white/5 p-4 rounded-xl items-center border border-white/5">
                        <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg">
                        <div class="flex-grow text-left">
                            <h4 class="font-bold text-sm">${item.name}</h4>
                            <p class="text-yellow-500 font-mono text-sm mt-1">NT$ ${item.price.toLocaleString()}</p>
                        </div>
                        <button onclick="removeFromCart(${item.cartId})" class="text-gray-500 hover:text-red-500"><i data-lucide="trash-2" size="18"></i></button>
                    </div>
                `).join('');
            
            total.innerText = `NT$ ${state.cart.reduce((s, i) => s + i.price, 0).toLocaleString()}`;
            lucide.createIcons();
        }

        function removeFromCart(cid) { state.cart = state.cart.filter(x => x.cartId !== cid); updateCartUI(); }

        // 6. 管理員登入流程
        function toggleAdminLogin(show) { document.getElementById('login-modal').classList.toggle('hidden', !show); }

        function processLogin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'Aeon.1388') {
                state.isAdmin = true;
                toggleAdminLogin(false);
                document.getElementById('logout-btn').classList.remove('hidden');
                alert('噗馬哥總裁，歡迎登入戰情中心！');
                render();
            } else {
                alert('密碼錯誤！');
            }
        }

        function logoutAdmin() {
            state.isAdmin = false;
            document.getElementById('logout-btn').classList.add('hidden');
            render();
        }

        function addNewProduct() {
            const name = document.getElementById('new-p-name').value;
            const price = document.getElementById('new-p-price').value;
            const model = document.getElementById('new-p-model').value;
            if(!name || !price || !model) return alert('請填寫完整資訊');
            
            state.products.unshift({
                id: Date.now(), name, price: parseInt(price), model,
                image: 'https://images.unsplash.com/photo-1558981403-c5f11bbdba27?auto=format&fit=crop&q=80&w=800',
                category: state.categories[0], stock: 10, sales: 0
            });
            render();
        }

        function deleteProduct(id) {
            state.products = state.products.filter(p => p.id !== id);
            render();
        }

        // 初始啟動
        window.onload = render;
    </script>
</body>
</html>
