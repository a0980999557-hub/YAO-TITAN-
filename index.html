<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAO-TITAN 曜鈦精密科技 | 動力解封，顛覆極限</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0a0a0a; color: #f3f4f6; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .titan-gradient { background: linear-gradient(to bottom, #FFD700, #B8860B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-glow { text-shadow: 0 0 30px rgba(255, 215, 0, 0.4); }
        #root:empty::before { content: '曜鈦動力 正在加載...'; color: #ca8a04; display: flex; justify-content: center; align-items: center; height: 100vh; font-weight: 900; letter-spacing: 0.5em; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        // 精確對接 Lucide 圖示 (對應總裁您的程式碼)
        const { 
          ShoppingBag, Settings, Wrench, Mail, ChevronRight, 
          Plus, Trash2, Cpu, Zap, ShieldCheck, Menu, X, PlusCircle, 
          Camera, TrendingUp, Eye, EyeOff, Edit3, BarChart3, Bell, Phone 
        } = LucideReact;

        const INITIAL_CATEGORIES = ['凸輪軸', '鍛造活塞', '前普利盤', '傳動離合器'];
        const INITIAL_PRODUCTS = [
          { id: 1, name: '賽道狂飆級 高角度凸輪軸', price: 12800, image: 'https://images.unsplash.com/photo-1558981403-c5f11bbdba27?auto=format&fit=crop&q=80&w=800', category: '凸輪軸', model: '勁戰六代 / 水冷BWS', stock: 15, sales: 128 },
          { id: 2, name: 'T6航太級 鍛造輕量活塞', price: 8500, image: 'https://images.unsplash.com/photo-1611039801831-28562d4e78a2?auto=format&fit=crop&q=80&w=800', category: '鍛造活塞', model: 'DRG 158 / MMBCU', stock: 0, sales: 85 },
          { id: 3, name: '秒殺起步 前普利盤套件', price: 4200, image: 'https://images.unsplash.com/photo-1589118949245-7d38baf380d6?auto=format&fit=crop&q=80&w=800', category: '前普利盤', model: 'KRV 180', stock: 20, sales: 310 },
          { id: 4, name: '暴力咬合 傳動離合器總成', price: 5800, image: 'https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&q=80&w=800', category: '傳動離合器', model: '全車系通用', stock: 5, sales: 240 }
        ];

        const App = () => {
          const [currentPage, setCurrentPage] = useState('home');
          const [categories, setCategories] = useState(INITIAL_CATEGORIES);
          const [products, setProducts] = useState(INITIAL_PRODUCTS);
          const [cart, setCart] = useState([]);
          const [isCartOpen, setIsCartOpen] = useState(false);
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [isAdminMode, setIsAdminMode] = useState(false);
          const [showLoginModal, setShowLoginModal] = useState(false);
          const [adminPassword, setAdminPassword] = useState('');
          const [showPassword, setShowPassword] = useState(false);
          const [newProduct, setNewProduct] = useState({ id: null, name: '', price: '', image: null, category: INITIAL_CATEGORIES[0], model: '', stock: 10 });
          const [isEditing, setIsEditing] = useState(false);
          const [newCategoryName, setNewCategoryName] = useState('');
          const [notifyProduct, setNotifyProduct] = useState(null);
          const [contactForm, setContactForm] = useState({ name: '', phone: '', email: '', message: '' });

          const stats = useMemo(() => {
            const currentMonthRevenue = products.reduce((acc, p) => acc + (p.price * Math.floor(p.sales * 0.1)), 0) + 1250000;
            const yearlyRevenue = products.reduce((acc, p) => acc + (p.price * p.sales), 0) + 15800000;
            return { currentMonthRevenue, yearlyRevenue };
          }, [products]);

          const handleLogin = () => {
            if (adminPassword === 'Aeon.1388') {
              setIsAdminMode(true);
              setShowLoginModal(false);
              setAdminPassword('');
              alert('噗馬哥總裁，歡迎登入戰情中心！');
            } else { alert('密碼錯誤！'); }
          };

          const addToCart = (product) => { setCart([...cart, { ...product, cartId: Date.now() }]); setIsCartOpen(true); };
          const removeFromCart = (cartId) => { setCart(cart.filter(item => item.cartId !== cartId)); };
          
          const NavItem = ({ id, label }) => (
            <button onClick={() => { setCurrentPage(id); setIsMenuOpen(false); window.scrollTo(0, 0); }}
              className={`px-4 py-2 text-sm md:text-base uppercase tracking-widest transition-all ${currentPage === id ? 'text-[#FFD700] font-bold underline' : 'text-gray-400 hover:text-white'}`}>
              {label}
            </button>
          );

          return (
            <div className="min-h-screen">
              {/* 導航欄 */}
              <nav className="fixed top-0 w-full z-50 bg-black/90 border-b border-white/10 h-24 flex items-center justify-between px-10">
                <div className="flex items-center gap-4 cursor-pointer" onClick={() => setCurrentPage('home')}>
                  <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" className="h-14 drop-shadow-[0_0_10px_rgba(255,215,0,0.5)]" />
                  <span className="text-2xl font-black titan-gradient hidden lg:block">曜鈦精密科技</span>
                </div>
                <div className="hidden lg:flex space-x-2">
                  <NavItem id="brand" label="霸主起源" /><NavItem id="products" label="神級改裝品" /><NavItem id="tech" label="黑科技支持" /><NavItem id="contact" label="聯絡我們" />
                </div>
                <div className="flex items-center gap-6">
                  <button onClick={() => setIsCartOpen(true)} className="relative text-yellow-500"><ShoppingBag size={28} />{cart.length > 0 && <span className="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full">{cart.length}</span>}</button>
                  <button className="lg:hidden" onClick={() => setIsMenuOpen(!isMenuOpen)}>{isMenuOpen ? <X size={28} /> : <Menu size={28} />}</button>
                </div>
              </nav>

              <main className="pt-24">
                {currentPage === 'home' && (
                  <section className="min-h-screen flex flex-col items-center justify-center text-center px-6 animate-in">
                    <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" className="w-56 h-56 mb-10 drop-shadow-[0_0_30px_rgba(255,215,0,0.4)]" />
                    <h2 class="text-xl font-bold tracking-[0.8em] text-yellow-600 mb-6 uppercase gold-glow">Precision Engineering</h2>
                    <h1 className="text-7xl md:text-9xl font-black mb-8">動力解封</h1>
                    <h1 className="text-4xl md:text-7xl font-black titan-gradient mb-12">顛覆業界的極致效能</h1>
                    <button onClick={() => setCurrentPage('products')} className="px-16 py-6 bg-yellow-600 text-black font-black text-2xl rounded-full shadow-2xl hover:scale-105 transition-all">解鎖神裝清單</button>
                  </section>
                )}

                {currentPage === 'products' && (
                  <section className="max-w-7xl mx-auto px-8 py-20 text-left">
                    <h2 className="text-5xl font-black mb-16">神級改裝品清單</h2>
                    {isAdminMode && (
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-16">
                        <div className="p-10 bg-neutral-900 rounded-3xl border border-yellow-500/30">
                          <p className="text-gray-500 font-bold text-sm tracking-widest uppercase">本月累積營收</p>
                          <p className="text-5xl font-black text-white mt-2">NT$ {stats.currentMonthRevenue.toLocaleString()}</p>
                        </div>
                        <div className="p-10 bg-neutral-900 rounded-3xl border border-yellow-500/30">
                          <p className="text-gray-500 font-bold text-sm tracking-widest uppercase">年度總計營收</p>
                          <p className="text-5xl font-black text-white mt-2">NT$ {stats.yearlyRevenue.toLocaleString()}</p>
                        </div>
                      </div>
                    )}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-10">
                      {products.map(p => (
                        <div key={p.id} className="bg-neutral-900 border border-white/5 rounded-[2.5rem] overflow-hidden hover:border-yellow-500 transition-all flex flex-col">
                          <img src={p.image} className="aspect-square object-cover" />
                          <div className="p-10 flex-grow">
                            <h3 className="font-bold text-2xl mb-4 h-16">{p.name}</h3>
                            <p className="text-gray-500 text-sm mb-6">適配: {p.model}</p>
                            <div className="flex justify-between items-center">
                              <p className="text-3xl font-black text-yellow-500">NT$ {p.price.toLocaleString()}</p>
                              <button onClick={() => addToCart(p)} className="px-6 py-3 bg-white text-black font-bold rounded-xl">加入</button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>
                )}
                
                {currentPage === 'brand' && <div class="py-40 text-center text-4xl font-black titan-gradient uppercase">霸主起源 探索中...</div>}
                {currentPage === 'tech' && <div class="py-40 text-center text-4xl font-black titan-gradient uppercase">黑科技 支持解析中...</div>}
                {currentPage === 'contact' && <div class="py-40 text-center text-4xl font-black titan-gradient uppercase">聯絡我們 準備中...</div>}
              </main>

              {/* 側欄購物車 */}
              {isCartOpen && (
                <div className="fixed inset-0 z-[100] bg-black/80 flex justify-end">
                  <div className="w-full max-w-md bg-neutral-900 h-full p-10 border-l border-white/10 flex flex-col">
                    <div className="flex justify-between items-center mb-10 text-yellow-500">
                      <h2 className="text-2xl font-black italic">SHOPPING BAG</h2>
                      <button onClick={() => setIsCartOpen(false)}><X /></button>
                    </div>
                    <div className="flex-grow overflow-y-auto space-y-6">
                      {cart.length === 0 ? <p className="text-center py-20 text-gray-600 font-bold uppercase">Empty</p> : 
                        cart.map(i => (
                          <div key={i.cartId} className="flex gap-4 items-center bg-black/30 p-4 rounded-2xl">
                            <img src={i.image} className="w-16 h-16 object-cover rounded-xl" />
                            <div className="flex-grow"><h4 class="font-bold text-sm">{i.name}</h4><p class="text-yellow-500 font-black mt-1">NT$ {i.price.toLocaleString()}</p></div>
                            <button onClick={() => removeFromCart(i.cartId)} className="text-gray-600"><Trash2 size={18} /></button>
                          </div>
                        ))}
                    </div>
                    <div className="pt-10 border-t border-white/10 mt-auto">
                      <div className="flex justify-between text-2xl font-black mb-8"><span>總計</span><span class="text-yellow-500">NT$ {cart.reduce((s, i) => s + i.price, 0).toLocaleString()}</span></div>
                      <button className="w-full py-5 bg-yellow-600 text-black font-black text-xl rounded-2xl italic tracking-widest">前往結帳</button>
                    </div>
                  </div>
                </div>
              )}

              {showLoginModal && (
                <div className="fixed inset-0 z-[110] bg-black/90 flex items-center justify-center p-6">
                  <div className="bg-neutral-900 p-10 rounded-[2.5rem] border border-yellow-500/30 w-full max-w-sm">
                    <h3 className="text-2xl font-black mb-8 text-yellow-500 text-center">總裁專屬登入</h3>
                    <input type="password" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} className="w-full bg-black p-5 border rounded-2xl mb-8" placeholder="請輸入密碼" />
                    <button onClick={handleLogin} className="w-full py-4 bg-yellow-600 text-black font-black rounded-2xl">登入解鎖</button>
                    <button onClick={() => setShowLoginModal(false)} class="w-full mt-4 text-gray-600 text-sm">取消</button>
                  </div>
                </div>
              )}

              <footer className="bg-black py-20 border-t border-white/5 text-center mt-20">
                <p className="text-gray-600 text-xs tracking-[0.5em] uppercase">© 2026 YAO-TITAN. ALL RIGHTS RESERVED.</p>
                <button onClick={() => setShowLoginModal(true)} className="mt-8 text-yellow-900 font-bold italic opacity-30 hover:opacity-100">管理員登入系統</button>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
