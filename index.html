<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAO-TITAN 曜鈦精密科技 | 動力解封，顛覆極限</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #050505; color: #fff; scroll-behavior: smooth; }
        .gold-glow { text-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
        .titan-gradient { background: linear-gradient(to bottom, #FFD700, #B8860B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-nav { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 215, 0, 0.15); }
        .panel-gold { background: #111; border: 1px solid rgba(255, 215, 0, 0.1); }
        .btn-titan { background: linear-gradient(to right, #ca8a04, #eab308); color: black; font-weight: 900; box-shadow: 0 10px 30px rgba(202, 138, 4, 0.3); }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 glass-nav h-24 flex items-center justify-between px-10">
        <div class="flex items-center gap-4 cursor-pointer" onclick="navigate('home')">
            <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" class="h-16 drop-shadow-[0_0_15px_rgba(255,215,0,0.5)]">
            <span class="text-2xl font-black tracking-[0.2em] titan-gradient hidden lg:block uppercase">曜鈦精密科技</span>
        </div>

        <div class="hidden lg:flex items-center space-x-12 text-sm font-bold tracking-[0.3em] text-gray-400">
            <button onclick="navigate('brand')" class="hover:text-yellow-500 transition-all">霸主起源</button>
            <button onclick="navigate('products')" class="hover:text-yellow-500 transition-all text-yellow-600">神級改裝品</button>
            <button onclick="navigate('tech')" class="hover:text-yellow-500 transition-all">黑科技支持</button>
            <button onclick="navigate('contact')" class="hover:text-yellow-500 transition-all">聯絡我們</button>
        </div>

        <div class="flex items-center gap-6">
            <button onclick="toggleCart(true)" class="relative text-yellow-500 hover:scale-110 transition-transform">
                <i data-lucide="shopping-bag" size="28"></i>
                <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-black hidden">0</span>
            </button>
            <button onclick="adminLogin()" class="text-gray-700 hover:text-yellow-500 transition-colors"><i data-lucide="settings" size="22"></i></button>
        </div>
    </nav>

    <main id="view-root" class="min-h-screen pt-24">
        </main>

    <div id="cart-drawer" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="toggleCart(false)"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-md bg-neutral-900 border-l border-yellow-600/30 p-10 flex flex-col shadow-2xl">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-3xl font-black text-yellow-500 italic tracking-tighter">SHOPPING BAG</h2>
                <button onclick="toggleCart(false)" class="text-gray-500 hover:rotate-90 transition-all"><i data-lucide="x"></i></button>
            </div>
            <div id="cart-list-container" class="flex-grow overflow-y-auto space-y-6">
                </div>
            <div class="border-t border-white/10 pt-10">
                <div class="flex justify-between text-2xl font-black mb-8"><span>總計</span><span id="cart-total-price" class="text-yellow-500 font-mono">NT$ 0</span></div>
                <button class="w-full py-5 btn-titan text-xl italic tracking-[0.2em] hover:brightness-110 transition-all">前往結帳，解除封印</button>
            </div>
        </div>
    </div>

    <div id="notify-modal" class="fixed inset-0 z-[110] bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-6">
        <div class="bg-neutral-900 border border-red-500/30 p-10 rounded-[2.5rem] w-full max-w-md relative shadow-2xl">
            <button onclick="toggleNotify(false)" class="absolute top-6 right-6 text-gray-500"><i data-lucide="x"></i></button>
            <div class="text-red-500 mb-6 flex items-center gap-3"><i data-lucide="bell" size="32"></i><h3 class="text-2xl font-black uppercase">貨到自動通知</h3></div>
            <p class="text-gray-400 text-sm mb-8 leading-relaxed">此神級裝備目前缺貨中，請留下您的聯繫方式，補貨時我們將第一時間發信通知您！</p>
            <div class="space-y-4 mb-10">
                <input type="text" placeholder="您的姓名" class="w-full bg-black border border-white/10 p-4 rounded-xl outline-none focus:border-red-500 text-white">
                <input type="email" placeholder="電子郵件信箱" class="w-full bg-black border border-white/10 p-4 rounded-xl outline-none focus:border-red-500 text-white">
            </div>
            <button onclick="submitNotify()" class="w-full py-5 bg-red-600 hover:bg-red-500 text-white font-black rounded-xl uppercase tracking-widest transition-all">確認送出設定</button>
        </div>
    </div>

    <footer class="bg-black py-24 border-t border-white/5 text-center px-10">
        <div class="flex flex-col items-center mb-10">
            <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" class="h-12 mb-6 opacity-50 grayscale">
            <p class="text-gray-600 text-xs tracking-[0.5em] uppercase">© 2026 YAO-TITAN PRECISION TECHNOLOGY. ALL RIGHTS RESERVED.</p>
        </div>
        <div class="text-yellow-900 font-black italic tracking-widest text-lg">研發監製：噗馬哥總裁</div>
    </footer>

    <script>
        // 1. 核心數據
        let state = {
            isAdmin: false,
            currentPage: 'home',
            categories: ['凸輪軸', '鍛造活塞', '前普利盤', '傳動離合器'],
            products: [
                { id: 1, name: '賽道狂飆級 高角度凸輪軸', price: 12800, category: '凸輪軸', model: '勁戰六代 / 水冷BWS', stock: 15, sales: 128, image: 'https://images.unsplash.com/photo-1558981403-c5f11bbdba27?auto=format&fit=crop&q=80&w=800' },
                { id: 2, name: 'T6航太級 鍛造輕量活塞', price: 8500, category: '鍛造活塞', model: 'DRG 158 / MMBCU', stock: 0, sales: 85, image: 'https://images.unsplash.com/photo-1611039801831-28562d4e78a2?auto=format&fit=crop&q=80&w=800' },
                { id: 3, name: '秒殺起步 前普利盤套件', price: 4200, category: '前普利盤', model: 'KRV 180', stock: 20, sales: 310, image: 'https://images.unsplash.com/photo-1589118949245-7d38baf380d6?auto=format&fit=crop&q=80&w=800' },
                { id: 4, name: '暴力咬合 傳動離合器總成', price: 5800, category: '傳動離合器', model: '全車系通用', stock: 5, sales: 240, image: 'https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&q=80&w=800' }
            ],
            cart: []
        };

        // 2. 導航渲染引擎
        function navigate(pageId) {
            state.currentPage = pageId;
            const root = document.getElementById('view-root');
            window.scrollTo(0, 0);

            if (pageId === 'home') {
                root.innerHTML = `
                    <section class="min-h-screen flex flex-col items-center justify-center text-center px-6 relative overflow-hidden fade-in">
                        <div class="absolute inset-0 bg-gradient-to-b from-yellow-600/5 to-transparent pointer-events-none"></div>
                        <div class="mb-14 relative">
                            <div class="absolute inset-0 blur-[80px] bg-yellow-600/20 rounded-full"></div>
                            <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" class="w-72 h-72 object-contain relative z-10 drop-shadow-[0_0_50px_rgba(255,215,0,0.4)]">
                        </div>
                        <h2 class="text-xl font-bold tracking-[1.2em] text-yellow-600 mb-10 uppercase gold-glow">Precision Engineering</h2>
                        <h1 class="text-7xl md:text-[140px] font-black mb-6 leading-none tracking-tighter text-white">動力解封</h1>
                        <h1 class="text-4xl md:text-8xl font-black titan-gradient mb-16 italic uppercase tracking-tighter">顛覆業界的極致效能</h1>
                        <p class="text-xl md:text-2xl text-gray-400 max-w-4xl mx-auto mb-20 leading-relaxed font-light">
                            明明比誰都渴望速度，卻總是受限於原廠封印？<br>
                            換上<span class="text-yellow-500 font-black">曜鈦精密</span>，您的座駕就是公路上的<span class="text-yellow-500 underline underline-offset-8">神級外掛</span>。
                        </p>
                        <button onclick="navigate('products')" class="px-20 py-7 btn-titan text-2xl tracking-[0.3em] hover:scale-105 transition-all">解鎖神裝清單</button>
                    </section>
                `;
            } else if (pageId === 'products') {
                renderProductsPage();
            } else {
                root.innerHTML = `<div class="py-64 text-center text-4xl font-black titan-gradient uppercase tracking-widest">${pageId} 頁面建置中</div>`;
            }
            lucide.createIcons();
        }

        // 3. 產品頁面與戰情室邏輯
        function renderProductsPage() {
            const root = document.getElementById('view-root');
            let adminSection = state.isAdmin ? `
                <div class="mb-20 space-y-10 fade-in">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                        <div class="p-10 panel-gold rounded-[2.5rem] shadow-2xl border-yellow-500/40 relative overflow-hidden group">
                            <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-30 transition-opacity"><i data-lucide="bar-chart-3" size="80"></i></div>
                            <p class="text-gray-500 font-black text-sm uppercase tracking-widest mb-2">本月累積預估營收</p>
                            <p class="text-6xl font-black text-white">NT$ ${(state.products.reduce((acc, p) => acc + (p.price * Math.floor(p.sales * 0.1)), 0) + 1250000).toLocaleString()}</p>
                        </div>
                        <div class="p-10 panel-gold rounded-[2.5rem] shadow-2xl border-yellow-500/40 relative overflow-hidden group">
                            <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-30 transition-opacity"><i data-lucide="trending-up" size="80"></i></div>
                            <p class="text-gray-500 font-black text-sm uppercase tracking-widest mb-2">年度總計實收額</p>
                            <p class="text-6xl font-black text-white font-mono">NT$ ${(state.products.reduce((acc, p) => acc + (p.price * p.sales), 0) + 15800000).toLocaleString()}</p>
                        </div>
                    </div>
                    <div class="p-10 panel-gold rounded-[2.5rem] border-yellow-600/30 text-left">
                        <h3 class="text-2xl font-black text-yellow-500 mb-8 flex items-center gap-3 uppercase italic"><i data-lucide="wrench"></i> 總裁戰情指揮後台</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <input id="p-name" placeholder="產品名稱" class="bg-black border border-white/10 p-5 rounded-2xl outline-none focus:border-yellow-500">
                            <input id="p-price" type="number" placeholder="建議售價" class="bg-black border border-white/10 p-5 rounded-2xl outline-none focus:border-yellow-500">
                            <input id="p-model" placeholder="適配機種" class="bg-black border border-white/10 p-5 rounded-2xl outline-none focus:border-yellow-500">
                        </div>
                        <button onclick="addProduct()" class="w-full mt-8 py-5 btn-titan rounded-2xl text-xl tracking-[0.2em] uppercase">確認上架全新武裝</button>
                    </div>
                </div>
            ` : '';

            root.innerHTML = `
                <div class="max-w-7xl mx-auto px-10 py-24 text-left">
                    <div class="mb-20">
                        <h2 class="text-6xl font-black italic tracking-tighter mb-4 uppercase">神級改裝品 <span class="titan-gradient tracking-widest">CORE SERIES</span></h2>
                        <div class="h-3 w-48 bg-yellow-600"></div>
                    </div>
                    ${adminSection}
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                        ${state.products.map(p => `
                            <div class="panel-gold rounded-[3rem] overflow-hidden group hover:border-yellow-500/50 transition-all duration-500 flex flex-col shadow-xl">
                                <div class="aspect-square relative overflow-hidden bg-black">
                                    <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-1000">
                                    <div class="absolute inset-0 bg-black/70 opacity-0 group-hover:opacity-100 flex items-center justify-center p-10 transition-all">
                                        <button onclick="${p.stock > 0 ? `buy(${p.id})` : `toggleNotify(true)`}" class="w-full py-5 ${p.stock > 0 ? 'bg-yellow-600 text-black' : 'bg-red-700 text-white'} font-black text-xl rounded-2xl uppercase tracking-widest shadow-2xl">
                                            ${p.stock > 0 ? '解鎖加入購物車' : '到貨自動通知'}
                                        </button>
                                    </div>
                                    ${p.stock <= 0 ? `<div class="absolute top-6 right-6 bg-red-600 text-white px-4 py-1 rounded-full text-xs font-black animate-pulse uppercase">Hot 完售</div>` : ''}
                                </div>
                                <div class="p-10 flex-grow text-left">
                                    <div class="flex justify-between items-start mb-4">
                                        <span class="text-xs font-black text-yellow-600 bg-yellow-600/10 px-3 py-1 rounded-sm uppercase tracking-widest">${p.category}</span>
                                        ${state.isAdmin ? `<button onclick="del(${p.id})" class="text-gray-700 hover:text-red-500"><i data-lucide="trash-2" size="20"></i></button>` : ''}
                                    </div>
                                    <h3 class="text-2xl font-black text-white mb-4 line-clamp-2 h-16">${p.name}</h3>
                                    <p class="text-gray-500 text-sm font-bold mb-8 uppercase tracking-widest">適配機種：${p.model}</p>
                                    <p class="text-3xl font-black text-yellow-500 font-mono tracking-tighter uppercase">NT$ ${p.price.toLocaleString()}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // 4. 業務功能腳本
        function buy(id) {
            const p = state.products.find(x => x.id === id);
            state.cart.push({ ...p, cartId: Date.now() });
            updateCart();
            toggleCart(true);
        }

        function updateCart() {
            const list = document.getElementById('cart-list-container');
            const total = document.getElementById('cart-total-price');
            const badge = document.getElementById('cart-badge');
            
            badge.innerText = state.cart.length;
            badge.classList.toggle('hidden', state.cart.length === 0);
            
            list.innerHTML = state.cart.length === 0 ? `<div class="py-20 text-center text-gray-600 font-black italic uppercase">Bag is Empty</div>` :
                state.cart.map(i => `
                    <div class="flex gap-6 bg-white/5 p-5 rounded-[1.5rem] items-center border border-white/5">
                        <img src="${i.image}" class="w-20 h-20 object-cover rounded-xl border border-white/10">
                        <div class="flex-grow text-left">
                            <h4 class="font-bold text-sm text-white">${i.name}</h4>
                            <p class="text-yellow-600 font-black text-lg mt-2">NT$ ${i.price.toLocaleString()}</p>
                        </div>
                        <button onclick="removeFromCart(${i.cartId})" class="text-gray-600 hover:text-red-500 transition-colors"><i data-lucide="trash-2" size="20"></i></button>
                    </div>
                `).join('');
            
            total.innerText = `NT$ ${state.cart.reduce((s, i) => s + i.price, 0).toLocaleString()}`;
            lucide.createIcons();
        }

        function removeFromCart(cid) { state.cart = state.cart.filter(x => x.cartId !== cid); updateCart(); }
        function toggleCart(show) { document.getElementById('cart-drawer').classList.toggle('hidden', !show); }
        function toggleNotify(show) { document.getElementById('notify-modal').classList.toggle('hidden', !show); }
        function submitNotify() { alert('系統已記錄設定！當庫存抵達時，噗馬哥總裁將第一時間通知您。'); toggleNotify(false); }

        function adminLogin() {
            const pass = prompt('【曜鈦精密 戰情中心驗證】\n請輸入管理員授權密碼：');
            if (pass === 'Aeon.1388') {
                state.isAdmin = true;
                alert('噗馬哥總裁，歡迎登入戰情中心！');
                navigate('products');
            } else if (pass !== null) {
                alert('密碼錯誤，拒絕訪問。');
            }
        }

        function addProduct() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const model = document.getElementById('p-model').value;
            if(!name || !price || !model) return alert('請填寫完整資訊');
            state.products.unshift({
                id: Date.now(), name, price: parseInt(price), model,
                image: 'https://images.unsplash.com/photo-1558981403-c5f11bbdba27?auto=format&fit=crop&q=80&w=800',
                category: state.categories[0], stock: 10, sales: 0
            });
            renderProductsPage();
        }

        function del(id) { state.products = state.products.filter(x => x.id !== id); renderProductsPage(); }

        // 啟動首頁
        window.onload = () => navigate('home');
    </script>
</body>
</html>
