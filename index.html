<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAO-TITAN 曜鈦精密科技 | 動力解封</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #050505; color: #fff; scroll-behavior: smooth; overflow-x: hidden; }
        .gold-glow { text-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
        .titan-gradient { background: linear-gradient(to bottom, #FFD700, #B8860B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-nav { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 215, 0, 0.15); }
        .panel-gold { background: #111; border: 1px solid rgba(255, 215, 0, 0.1); }
        .btn-gold { background: linear-gradient(to right, #ca8a04, #eab308); color: black; font-weight: 900; box-shadow: 0 10px 30px rgba(202, 138, 4, 0.3); }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 glass-nav h-24 flex items-center justify-between px-10">
        <div class="flex items-center gap-4 cursor-pointer" onclick="render('home')">
            <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" class="h-16 drop-shadow-[0_0_15px_rgba(255,215,0,0.5)]">
            <span class="text-2xl font-black tracking-[0.2em] titan-gradient hidden lg:block uppercase">曜鈦精密科技</span>
        </div>
        <div class="hidden lg:flex items-center space-x-12 text-sm font-bold tracking-[0.3em] text-gray-400">
            <button onclick="render('brand')" class="hover:text-yellow-500 transition-all">霸主起源</button>
            <button onclick="render('products')" class="hover:text-yellow-500 transition-all">神級改裝品</button>
            <button onclick="render('tech')" class="hover:text-yellow-500 transition-all">黑科技支持</button>
            <button onclick="render('contact')" class="hover:text-yellow-500 transition-all">聯絡我們</button>
        </div>
        <div class="flex items-center gap-6">
            <button onclick="toggleCart(true)" class="relative text-yellow-500"><i data-lucide="shopping-bag" size="28"></i><span id="cart-badge" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-black hidden">0</span></button>
            <button onclick="adminLogin()" class="text-gray-700 hover:text-yellow-500"><i data-lucide="settings" size="22"></i></button>
        </div>
    </nav>

    <main id="app-view" class="pt-24 min-h-screen"></main>

    <div id="cart-drawer" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/80" onclick="toggleCart(false)"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-md bg-neutral-900 p-10 flex flex-col border-l border-yellow-600/30">
            <div class="flex justify-between items-center mb-10"><h2 class="text-3xl font-black text-yellow-500 italic">SHOPPING BAG</h2><button onclick="toggleCart(false)"><i data-lucide="x"></i></button></div>
            <div id="cart-list" class="flex-grow overflow-y-auto space-y-6"></div>
            <div class="border-t border-white/10 pt-10">
                <div class="flex justify-between text-2xl font-black mb-8"><span>總計</span><span id="cart-total" class="text-yellow-500">NT$ 0</span></div>
                <button class="w-full py-5 btn-gold text-xl italic tracking-widest">前往結帳，解除封印</button>
            </div>
        </div>
    </div>

    <footer class="bg-black py-24 border-t border-white/5 text-center px-10 mt-20">
        <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" class="h-12 mb-6 opacity-30">
        <p class="text-gray-600 text-xs tracking-[0.5em] uppercase">© 2026 YAO-TITAN PRECISION. ALL RIGHTS RESERVED.</p>
        <p class="mt-4 text-yellow-900 font-bold italic tracking-widest">研發監製：噗馬哥總裁</p>
    </footer>

    <script>
        // --- 100% 還原：原始數據與邏輯 ---
        let state = {
            isAdmin: false,
            cart: [],
            products: [
                { id: 1, name: '賽道狂飆級 高角度凸輪軸', price: 12800, category: '凸輪軸', model: '勁戰六代 / 水冷BWS', stock: 15, sales: 128, image: 'https://images.unsplash.com/photo-1558981403-c5f11bbdba27?auto=format&fit=crop&q=80&w=800' },
                { id: 2, name: 'T6航太級 鍛造輕量活塞', price: 8500, category: '鍛造活塞', model: 'DRG 158 / MMBCU', stock: 0, sales: 85, image: 'https://images.unsplash.com/photo-1611039801831-28562d4e78a2?auto=format&fit=crop&q=80&w=800' },
                { id: 3, name: '秒殺起步 前普利盤套件', price: 4200, category: '前普利盤', model: 'KRV 180', stock: 20, sales: 310, image: 'https://images.unsplash.com/photo-1589118949245-7d38baf380d6?auto=format&fit=crop&q=80&w=800' },
                { id: 4, name: '暴力咬合 傳動離合器總成', price: 5800, category: '傳動離合器', model: '全車系通用', stock: 5, sales: 240, image: 'https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&q=80&w=800' }
            ]
        };

        function render(page) {
            const view = document.getElementById('app-view');
            window.scrollTo(0, 0);

            if (page === 'home') {
                view.innerHTML = `
                    <section class="min-h-screen flex flex-col items-center justify-center text-center px-6 fade-in">
                        <div class="mb-14 relative">
                            <div class="absolute inset-0 blur-[80px] bg-yellow-600/20 rounded-full"></div>
                            <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" class="w-72 h-72 relative z-10 drop-shadow-2xl">
                        </div>
                        <h2 class="text-xl font-bold tracking-[1.2em] text-yellow-600 mb-10 uppercase gold-glow">Precision Engineering</h2>
                        <h1 class="text-7xl md:text-[140px] font-black mb-6 leading-none tracking-tighter text-white">動力解封</h1>
                        <h1 class="text-4xl md:text-8xl font-black titan-gradient mb-16 italic tracking-tighter uppercase">顛覆業界的極致效能</h1>
                        <p class="text-xl md:text-2xl text-gray-400 max-w-4xl mx-auto mb-20 leading-relaxed font-light px-4">換上<span class="text-yellow-500 font-black">曜鈦精密</span>，您的座駕就是公路上的<span class="text-yellow-500 underline underline-offset-8">神級外掛</span>。</p>
                        <button onclick="render('products')" class="px-20 py-7 btn-gold text-2xl tracking-[0.3em] hover:scale-105 transition-all">解鎖神裝清單</button>
                    </section>
                `;
            } else if (page === 'brand') {
                view.innerHTML = `
                    <section class="max-w-6xl mx-auto px-10 py-32 text-left fade-in">
                        <h2 class="text-6xl font-black mb-16 border-l-8 border-yellow-500 pl-8 uppercase">霸主降臨｜品牌起源</h2>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
                            <div class="space-y-10 text-gray-300 leading-loose text-xl font-light">
                                <p class="first-letter:text-8xl first-letter:font-black first-letter:text-yellow-500 first-letter:mr-4 first-letter:float-left">曜鈦精密科技，為顛覆而生。</p>
                                <p>我們看過太多騎士受限於原廠的保守設定。那種無法完全釋放的憋屈感，我們懂。所以我們決定親自操刀，打破這層束縛。</p>
                                <p class="font-bold text-white border-l-4 border-yellow-600 pl-6 py-6 bg-white/5 rounded-r-3xl">「妥協，從不在我們的字典裡。」我們不只是在做一般零件，我們是在打造「神級外掛」。</p>
                            </div>
                            <img src="https://images.unsplash.com/photo-1591702548275-348546daaec3?auto=format&fit=crop&q=80&w=800" class="rounded-[3rem] shadow-2xl">
                        </div>
                    </section>
                `;
            } else if (page === 'products') {
                let adminUI = state.isAdmin ? `
                    <div class="mb-20 space-y-10">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                            <div class="p-10 panel-gold rounded-[2.5rem] shadow-2xl"><p class="text-gray-500 font-black text-sm uppercase tracking-widest mb-2">本月累積預估營收</p><p class="text-6xl font-black text-white">NT$ ${(state.products.reduce((acc, p) => acc + (p.price * Math.floor(p.sales * 0.1)), 0) + 1250000).toLocaleString()}</p></div>
                            <div class="p-10 panel-gold rounded-[2.5rem] shadow-2xl"><p class="text-gray-500 font-black text-sm uppercase tracking-widest mb-2">年度總計營收</p><p class="text-6xl font-black text-white">NT$ ${(state.products.reduce((acc, p) => acc + (p.price * p.sales), 0) + 15800000).toLocaleString()}</p></div>
                        </div>
                    </div>
                ` : '';
                view.innerHTML = `
                    <div class="max-w-7xl mx-auto px-10 py-32 text-left">
                        <h2 class="text-6xl font-black italic tracking-tighter mb-16 uppercase">神級改裝品 <span class="titan-gradient tracking-widest">CORE SERIES</span></h2>
                        ${adminUI}
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                            ${state.products.map(p => `
                                <div class="panel-gold rounded-[3rem] overflow-hidden group hover:border-yellow-500/50 transition-all duration-500 flex flex-col shadow-xl">
                                    <div class="aspect-square relative overflow-hidden bg-black">
                                        <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-1000">
                                        <div class="absolute inset-0 bg-black/70 opacity-0 group-hover:opacity-100 flex items-center justify-center p-10 transition-all">
                                            <button onclick="buyProduct(${p.id})" class="w-full py-5 ${p.stock > 0 ? 'bg-yellow-600 text-black' : 'bg-red-700'} font-black text-xl rounded-2xl uppercase tracking-widest">
                                                ${p.stock > 0 ? '解鎖加入購物車' : '到貨自動通知'}
                                            </button>
                                        </div>
                                    </div>
                                    <div class="p-10 flex-grow">
                                        <span class="text-xs font-black text-yellow-600 bg-yellow-600/10 px-3 py-1 rounded-sm uppercase tracking-widest">${p.category} | ${p.model}</span>
                                        <h3 class="text-2xl font-black text-white mt-4 mb-4 line-clamp-2 h-16">${p.name}</h3>
                                        <p class="text-3xl font-black text-yellow-500 font-mono tracking-tighter uppercase">NT$ ${p.price.toLocaleString()}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (page === 'tech') {
                view.innerHTML = `
                    <div class="max-w-7xl mx-auto px-10 py-32 fade-in">
                        <h2 class="text-6xl font-black mb-24 text-center uppercase tracking-widest">黑科技支持</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
                            <div class="p-12 panel-gold rounded-[3rem] hover:border-yellow-500 transition-all"><i data-lucide="zap" class="text-yellow-500 w-16 h-16 mb-8"></i><h3 class="text-2xl font-black mb-6 text-white uppercase">狂暴凸輪性能躍進</h3><p class="text-gray-400">重塑引擎呼吸節奏。獨家精算高角度凸輪軸幾何，突破原廠揚程封印。</p></div>
                            <div class="p-12 panel-gold rounded-[3rem] hover:border-yellow-500 transition-all"><i data-lucide="trending-up" class="text-yellow-500 w-16 h-16 mb-8"></i><h3 class="text-2xl font-black mb-6 text-white uppercase">神級缸頭氣道優化</h3><p class="text-gray-400">氣流就是力量！導入超精密流體力學運算，實現零阻力進氣。</p></div>
                            <div class="p-12 panel-gold rounded-[3rem] hover:border-yellow-500 transition-all"><i data-lucide="shield-check" class="text-yellow-500 w-16 h-16 mb-8"></i><h3 class="text-2xl font-black mb-6 text-white uppercase">賽道級極限耐久</h3><p class="text-gray-400">採用航太級高強度材質。在極端高溫下，依然維持 100% 巔峰輸出。</p></div>
                        </div>
                    </div>
                `;
            } else if (page === 'contact') {
                view.innerHTML = `
                    <div class="max-w-5xl mx-auto px-10 py-32 fade-in">
                        <h2 class="text-6xl font-black mb-16 italic uppercase">與我們聯繫</h2>
                        <div class="panel-gold p-16 rounded-[3rem] text-left">
                            <p class="text-2xl mb-12 text-gray-400">準備好解鎖愛車的封印了嗎？請留下您的需求，曜鈦團隊將盡速回覆。</p>
                            <div class="space-y-8">
                                <div class="flex items-center gap-6 text-2xl"><i data-lucide="phone" class="text-yellow-500"></i> Line ID: <span class="font-mono text-white">a0980999557</span></div>
                                <div class="flex items-center gap-6 text-2xl"><i data-lucide="mail" class="text-yellow-500"></i> Email: <span class="text-white">yaotitascand@gmail.com</span></div>
                            </div>
                            <button onclick="window.location.href='mailto:yaotitascand@gmail.com'" class="mt-16 w-full py-6 btn-gold text-2xl tracking-[0.2em] rounded-3xl">發送諮詢需求</button>
                        </div>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        // --- 核心功能中心 ---
        function buyProduct(id) {
            const p = state.products.find(x => x.id === id);
            if (p.stock <= 0) return alert('系統已記錄！補貨時將通知您。');
            state.cart.push({ ...p, cartId: Date.now() });
            updateCart();
            toggleCart(true);
        }

        function updateCart() {
            const list = document.getElementById('cart-list');
            const total = document.getElementById('cart-total');
            const badge = document.getElementById('cart-badge');
            badge.innerText = state.cart.length;
            badge.classList.toggle('hidden', state.cart.length === 0);
            list.innerHTML = state.cart.length === 0 ? `<div class="py-20 text-center text-gray-600 font-bold uppercase">Bag is Empty</div>` :
                state.cart.map(i => `
                    <div class="flex gap-6 bg-white/5 p-5 rounded-[1.5rem] items-center">
                        <img src="${i.image}" class="w-16 h-16 object-cover rounded-xl">
                        <div class="flex-grow text-left"><h4 class="font-bold text-sm text-white">${i.name}</h4><p class="text-yellow-600 font-black mt-1">NT$ ${i.price.toLocaleString()}</p></div>
                        <button onclick="removeFromCart(${i.cartId})" class="text-red-500"><i data-lucide="trash-2" size="20"></i></button>
                    </div>
                `).join('');
            total.innerText = `NT$ ${state.cart.reduce((s, i) => s + i.price, 0).toLocaleString()}`;
            lucide.createIcons();
        }

        function removeFromCart(cid) { state.cart = state.cart.filter(x => x.cartId !== cid); updateCart(); }
        function toggleCart(show) { document.getElementById('cart-drawer').classList.toggle('hidden', !show); }

        function adminLogin() {
            const pass = prompt('【曜鈦精密 戰情中心驗證】密碼：');
            if (pass === 'Aeon.1388') {
                state.isAdmin = true;
                alert('噗馬哥總裁，歡迎登入戰情中心！');
                render('products');
            } else if (pass !== null) { alert('密碼錯誤！'); }
        }

        window.onload = () => render('home');
    </script>
</body>
</html>
