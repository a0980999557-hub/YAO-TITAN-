<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YAO TITAN｜ENGINE PERFORMANCE DEVELOPMENT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap');
:root{--bg:#07090b;--panel:#0d1014;--line:rgba(255,255,255,.1);--muted:#899199;--gold:#d3b06d;--white:#f5f6f4}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--white);font-family:'Noto Sans TC',sans-serif;font-size:18px}.header{height:78px;position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:rgba(7,9,11,.86);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{font:700 26px Rajdhani,sans-serif;letter-spacing:.08em;color:#fff}.brand small{display:block;color:var(--gold);font:600 9px Rajdhani,sans-serif;letter-spacing:.24em}.nav{display:flex;gap:20px;align-items:center}.nav button{background:none;border:0;color:#899199;font-size:17px;cursor:pointer;padding:10px 5px}.nav button:hover,.nav button.active{color:var(--gold)}.cta{border:1px solid rgba(211,176,109,.5)!important;padding:10px 16px!important;color:#eee!important}.hero{min-height:100vh;position:relative;display:flex;align-items:center;padding:130px 8vw 80px;overflow:hidden;background:linear-gradient(125deg,#07090b,#0b0f13 55%,#080a0d)}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.2;filter:grayscale(1) contrast(1.15)}.hero:after{content:'';position:absolute;right:4%;top:17%;width:610px;height:610px;border:1px solid rgba(211,176,109,.15);border-radius:50%;box-shadow:0 0 0 42px rgba(255,255,255,.015),0 0 0 84px rgba(255,255,255,.01)}.hero:before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:72px 72px;opacity:.2}.hero-content{position:relative;z-index:2;max-width:1000px}.eyebrow{color:var(--gold);font:600 17px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:0 0 20px}.hero h1{font:700 clamp(58px,8.3vw,128px)/.84 Rajdhani,sans-serif;letter-spacing:-.04em;margin:0}.hero h1 em{font-style:normal;color:transparent;-webkit-text-stroke:1px rgba(245,246,244,.65)}.hero-copy{font-size:clamp(20px,2vw,28px);line-height:1.65;color:#b1b7bc;margin:38px 0}.buttons{display:flex;gap:12px}.primary,.ghost{padding:14px 22px;border:1px solid var(--gold);cursor:pointer;font-size:17px}.primary{background:var(--gold);color:#090b0d;font-weight:700}.ghost{background:transparent;color:#fff;border-color:#555d64}.section{padding:120px 8vw;border-top:1px solid var(--line)}.statement{max-width:1150px}.statement h2,.heritage h2{font-size:clamp(40px,5vw,74px);line-height:1.08;margin:0 0 28px}.statement h2 span,.heritage h2 span{color:#737c84}.body{max-width:800px;color:#9199a0;line-height:2;font-size:19px}.heritage{display:grid;grid-template-columns:.9fr 1.1fr;gap:80px}.timeline{border-top:1px solid var(--line)}.node{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:28px 0;border-bottom:1px solid var(--line)}.node b{font:700 31px Rajdhani;color:var(--gold)}.node strong{font-size:20px}.node p{color:#737c84;line-height:1.8;font-size:17px;margin:8px 0 0}.cap-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:45px}.cap-head h2{font-size:52px;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.card{padding:30px 26px;min-height:310px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}..card .num{
  color:var(--gold);
  font:700 52px Rajdhani;
  line-height:1;
  margin-bottom:32px;
  letter-spacing:-1px;
}.card h3{font:700 19px Rajdhani;margin:0 0 8px}.card h4{font-size:21px;margin:0 0 18px}.card p{font-size:18px;color:#808991;line-height:1.7}.photo-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.photo-title h2{font-size:46px;margin:0}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.photo{background:#0b0e12;border:1px solid var(--line);margin:0;cursor:zoom-in;transition:transform .2s,border-color .2s}.photo:hover{transform:translateY(-3px);border-color:rgba(211,176,109,.55)}.photo img{width:100%;height:220px;object-fit:cover;display:block}.photo figcaption{padding:15px 17px}.photo figcaption strong{display:block}.photo figcaption span{display:block;color:#737c84;font-size:15px;margin-top:6px}.cta-band{margin-top:100px;padding:50px;border:1px solid rgba(211,176,109,.25);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(110deg,rgba(211,176,109,.08),rgba(255,255,255,.01))}.cta-band h2{font-size:38px;margin:0}.page{display:none;padding:145px 8vw 120px;min-height:100vh}.page.active{display:block}.page h1{font:700 clamp(55px,8vw,105px)/.9 Rajdhani;margin:0 0 70px}.page .lead{font-size:34px;line-height:1.35;max-width:800px}.process{display:grid;grid-template-columns:repeat(3,1fr);margin-top:60px}.step{padding:28px;border:1px solid var(--line);margin:-1px 0 0 -1px}.step span{color:var(--gold);font:600 12px Rajdhani}.step strong{display:block;font-size:21px;margin-top:35px}.case-photo{width:100%;max-height:500px;object-fit:cover;margin-top:45px;cursor:zoom-in}.footer{padding:45px 8vw;border-top:1px solid var(--line);color:#687078;display:flex;justify-content:space-between;gap:20px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:none;align-items:center;justify-content:center;padding:30px}.modal.open{display:flex}.modal img{max-width:92vw;max-height:88vh;object-fit:contain;box-shadow:0 20px 80px rgba(0,0,0,.5)}.modal button{position:absolute;right:28px;top:22px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;font-size:28px;cursor:pointer}.modal-caption{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:16px}.mobile-menu{display:none}
@media(max-width:900px){.nav{display:none}.mobile-menu{display:block;background:none;border:1px solid #555;color:#fff;padding:9px 12px}.hero,.section,.page{padding-left:6vw;padding-right:6vw}.grid{grid-template-columns:1fr 1fr}.heritage{grid-template-columns:1fr}.photos{grid-template-columns:1fr 1fr}.hero:after{display:none}}
@media(max-width:560px){.hero h1{font-size:54px}.hero-copy{font-size:18px}.buttons{flex-direction:column}.grid,.photos,.process{grid-template-columns:1fr}.cap-head{display:block}.cap-head h2,.photo-title h2{font-size:36px}.node{grid-template-columns:75px 1fr}.footer{display:block}.page .lead{font-size:26px}}
</style>
</head>
<body>
<header class="header"><div class="brand" id="brand"></div><nav class="nav" id="nav"></nav><button class="mobile-menu" id="mobileMenu">MENU</button></header>
<main>
<section id="home" class="hero"><img id="hero-image" src="history/04.jpg"><div class="hero-content"><p id="hero-eyebrow" class="eyebrow"></p><h1><span id="hero-title1"></span><br><em id="hero-title2"></em><br><span id="hero-title3"></span></h1><p class="hero-copy"><span id="hero-copy1"></span><br><span id="hero-copy2"></span></p><div class="buttons"><button class="primary" id="hero-btn1"></button><button class="ghost" id="hero-btn2"></button></div></div></section>
<section class="section statement"><p id="approach-eyebrow" class="eyebrow"></p><h2><span id="approach-title1"></span><br><span id="approach-title2"></span></h2><p id="approach-body" class="body"></p></section>
<section class="section heritage"><div><p id="heritage-eyebrow" class="eyebrow"></p><h2><span id="heritage-title1"></span><br><span id="heritage-title2"></span></h2><p id="heritage-body" class="body"></p></div><div class="timeline" id="home-timeline"></div></section>
<section class="section"><div class="cap-head"><div><p id="cap-eyebrow" class="eyebrow"></p><h2 id="cap-title"></h2></div><span id="cap-range"></span></div><div class="grid" id="cap-grid"></div></section>
<section class="section"><div class="photo-title"><div><p id="gallery-eyebrow" class="eyebrow"></p><h2 id="gallery-title"></h2></div></div><div class="photos" id="gallery-grid"></div><div class="cta-band"><div><p id="gallery-cta-eyebrow" class="eyebrow"></p><h2 id="gallery-cta-title"></h2></div><button class="primary" id="gallery-cta-btn">技術諮詢 →</button></div></section>
<section id="development" class="page"><p id="dev-eyebrow" class="eyebrow"></p><h1 id="dev-title"></h1><p id="dev-lead" class="lead"></p><p id="dev-body" class="body"></p><div class="process" id="dev-steps"></div></section>
<section id="testing" class="page"><p id="testing-eyebrow" class="eyebrow"></p><h1 id="testing-title"></h1><p id="testing-lead" class="lead"></p><div class="photos" style="margin-top:60px" id="testing-grid"></div></section>
<section id="history" class="page"><p id="history-eyebrow" class="eyebrow"></p><h1 id="history-title"></h1><div class="timeline" id="history-timeline"></div><div id="history-images"></div></section>
<section id="about" class="page"><p id="about-eyebrow" class="eyebrow"></p><h1 id="about-title"></h1><p id="about-p1" class="body"></p><p id="about-p2" class="body"></p><img id="about-image" class="case-photo"></section>
<section id="contact" class="page"><p id="contact-eyebrow" class="eyebrow"></p><h1 id="contact-title"></h1><p id="contact-lead" class="lead"></p><p id="contact-body" class="body"></p></section>
</main>
<footer class="footer"><div id="footer-left"></div><div id="footer-right"></div></footer>
<div class="modal" id="photoModal"><button id="modalClose">×</button><button id="modalPrev" style="position:absolute;left:24px;top:50%;transform:translateY(-50%);font-size:38px">‹</button><img id="modalImage"><button id="modalNext" style="position:absolute;right:24px;top:50%;transform:translateY(-50%);font-size:38px">›</button><div class="modal-caption" id="modalCaption"></div></div>
<script>
let content=null;
const $=id=>document.getElementById(id);
const set=(id,v)=>{const e=$(id);if(e)e.textContent=v??''};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function show(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.hero,.section').forEach(x=>x.style.display='');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(id==='home'){window.scrollTo(0,0);return}document.querySelectorAll('.hero,.section').forEach(x=>x.style.display='none');const page=$(id);if(page)page.classList.add('active');if(btn)btn.classList.add('active');window.scrollTo(0,0)}
function navButton(label,id){const b=document.createElement('button');b.textContent=label;b.addEventListener('click',()=>show(id,b));return b}
let modalGallery=[];let modalIndex=0;function openPhoto(src,caption,gallery){modalGallery=gallery&&gallery.length?gallery:[src];modalIndex=Math.max(0,modalGallery.indexOf(src));$('modalImage').src=modalGallery[modalIndex];$('modalCaption').textContent=(caption||'')+(modalGallery.length>1?`  ·  ${modalIndex+1}/${modalGallery.length}`:'');$('photoModal').classList.add('open')}
function stepPhoto(dir){if(modalGallery.length<2)return;modalIndex=(modalIndex+dir+modalGallery.length)%modalGallery.length;$('modalImage').src=modalGallery[modalIndex];$('modalCaption').textContent=($('modalCaption').textContent.split('  ·  ')[0])+(modalGallery.length>1?`  ·  ${modalIndex+1}/${modalGallery.length}`:'')}
function closePhoto(){$('photoModal').classList.remove('open');$('modalImage').src=''}
function firstImage(x){return (x.images&&x.images.length?x.images[0]:x.image)||''}
function photoHtml(x){const src=firstImage(x);return `<figure class="photo" data-src="${esc(src)}" data-caption="${esc(x.title||'')}"><img src="${esc(src)}" alt="${esc(x.title||'')}"><figcaption><strong>${esc(x.title||'')}</strong><span>${esc(x.desc||'')}</span>${x.images&&x.images.length>1?`<small style="display:block;color:#d3b06d;margin-top:8px">${x.images.length} 張照片 · 點擊查看</small>`:''}</figcaption></figure>`}
function bindPhotoClicks(root){root.querySelectorAll('.photo').forEach(el=>el.addEventListener('click',()=>{const item=(content.history||[]).find(x=>firstImage(x)===el.dataset.src)||(content.testing?.items||[]).find(x=>firstImage(x)===el.dataset.src);openPhoto(el.dataset.src,el.dataset.caption,item?.images||[el.dataset.src])}))}
function timelineHtml(items){return (items||[]).map(x=>`<div class="node"><b>${esc(x.year)}</b><div><strong>${esc(x.title)}</strong><p>${esc(x.desc)}</p></div></div>`).join('')}
async function load(){
 const r=await fetch('content.json?'+Date.now());if(!r.ok)throw new Error('content.json 讀取失敗');content=await r.json();
 const s=content.site||{};set('brand',s.brand);$('brand').insertAdjacentHTML('beforeend',`<small>${esc(s.brandSub||'PRECISION TECHNOLOGY')}</small>`);set('hero-eyebrow',s.eyebrow);set('hero-title1',s.heroTitle1);set('hero-title2',s.heroTitle2);set('hero-title3',s.heroTitle3);set('hero-copy1',s.heroCopy1);set('hero-copy2',s.heroCopy2);$('hero-image').src=s.heroImage||'history/04.jpg';set('hero-btn1',s.heroButton1);set('hero-btn2',s.heroButton2);set('footer-left',s.footerLeft);set('footer-right',s.footerRight);
 const nav=$('nav');nav.innerHTML='';[['首頁','home'],['動力開發','development'],['測試與數據','testing'],['品牌歷程','history'],['關於曜鈦','about'],['技術諮詢','contact']].forEach(([t,id],i)=>{const b=navButton(t,id);if(id==='contact')b.classList.add('cta');if(i===0)b.classList.add('active');nav.appendChild(b)});
 $('hero-btn1').onclick=()=>show('development');$('hero-btn2').onclick=()=>show('testing');$('gallery-cta-btn').onclick=()=>show('contact');
 const a=content.approach||{};set('approach-eyebrow',a.eyebrow);set('approach-title1',a.title1);set('approach-title2',a.title2);set('approach-body',a.body);
 const h=content.heritage||{};set('heritage-eyebrow',h.eyebrow);set('heritage-title1',h.title1);set('heritage-title2',h.title2);set('heritage-body',h.body);$('home-timeline').innerHTML=timelineHtml(content.timeline);
 const cap=content.capabilities||{};set('cap-eyebrow',cap.eyebrow);set('cap-title',cap.title);set('cap-range',cap.range);$('cap-grid').innerHTML=(cap.items||[]).map(x=>`<article class="card"><div class="num">${esc(x.num)}</div><h3>${esc(x.en)}</h3><h4>${esc(x.title)}</h4><p>${esc(x.body)}</p></article>`).join('');
 const g=content.gallery||{};set('gallery-eyebrow',g.eyebrow);set('gallery-title',g.title);set('gallery-cta-eyebrow',g.ctaEyebrow);set('gallery-cta-title',g.ctaTitle);$('gallery-grid').innerHTML=(content.history||[]).map(photoHtml).join('');bindPhotoClicks($('gallery-grid'));
 const d=content.development||{};set('dev-eyebrow',d.eyebrow);set('dev-title',d.title);set('dev-lead',d.lead);set('dev-body',d.body);$('dev-steps').innerHTML=(d.steps||[]).map((x,i)=>`<div class="step"><span>${String(i+1).padStart(2,'0')}</span><strong>${esc(x)}</strong></div>`).join('');
 const t=content.testing||{};set('testing-eyebrow',t.eyebrow);set('testing-title',t.title);set('testing-lead',t.lead);$('testing-grid').innerHTML=(t.items||[]).map(photoHtml).join('');bindPhotoClicks($('testing-grid'));
 const hp=content.historyPage||{};set('history-eyebrow',hp.eyebrow);set('history-title',hp.title);$('history-timeline').innerHTML=timelineHtml(content.timeline);$('history-images').innerHTML=(content.history||[]).map(x=>`<div style="margin:50px 0"><h2 style="font-size:32px;margin:0 0 18px">${esc(x.title||'')}</h2><p class="body" style="margin:0 0 18px">${esc(x.desc||'')}</p><div class="photos">${(x.images&&x.images.length?x.images:[x.image]).filter(Boolean).map(src=>`<img class="case-photo" style="margin-top:0" src="${esc(src)}" data-large="${esc(src)}" alt="${esc(x.title||'')}">`).join('')}</div></div>`).join('');$('history-images').querySelectorAll('.case-photo').forEach(img=>img.addEventListener('click',()=>openPhoto(img.dataset.large,img.alt)));
 const ab=content.about||{};set('about-eyebrow',ab.eyebrow);set('about-title',ab.title);set('about-p1',ab.p1);set('about-p2',ab.p2);$('about-image').src=ab.image||((ab.images||[])[0]||'');if($('about-image').src)$('about-image').addEventListener('click',()=>openPhoto($('about-image').src,'關於曜鈦'));
 const co=content.contact||{};set('contact-eyebrow',co.eyebrow);set('contact-title',co.title);set('contact-lead',co.lead);set('contact-body',co.body);
}
$('modalClose').addEventListener('click',closePhoto);$('modalPrev').addEventListener('click',e=>{e.stopPropagation();stepPhoto(-1)});$('modalNext').addEventListener('click',e=>{e.stopPropagation();stepPhoto(1)});$('photoModal').addEventListener('click',e=>{if(e.target===$('photoModal'))closePhoto()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')stepPhoto(-1);if(e.key==='ArrowRight')stepPhoto(1)});$('mobileMenu').addEventListener('click',()=>{const first=$('nav').querySelector('button');if(first)show('home',first)});
load().catch(e=>console.error(e));
</script>
</body></html>
