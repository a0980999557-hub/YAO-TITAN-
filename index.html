<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAO-TITAN 曜鈦精密科技 | 注入賽道靈魂，解鎖動力封印</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        /* 針對動畫優化 */
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#0a0a0a] text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        // 2. 解構 React 與 Lucide 功能 (取代 import)
        const { useState, useEffect, useMemo } = React;
        const { 
          ShoppingBag, Settings, Wrench, Mail, ChevronRight, 
          Plus, Trash2, Cpu, Zap, ShieldCheck, Menu, X, PlusCircle, 
          Camera, TrendingUp, Eye, EyeOff, Edit3, BarChart3, Bell, Phone 
        } = LucideReact;

        // --- 預設分類與產品資料 ---
        const INITIAL_CATEGORIES = ['凸輪軸', '鍛造活塞', '前普利盤', '傳動離合器'];
        const INITIAL_PRODUCTS = [
          { id: 1, name: '賽道狂飆級 高角度凸輪軸', price: 12800, image: 'https://images.unsplash.com/photo-1558981403-c5f11bbdba27?auto=format&fit=crop&q=80&w=800', category: '凸輪軸', model: '勁戰六代 / 水冷BWS', stock: 15, sales: 128 },
          { id: 2, name: 'T6航太級 鍛造輕量活塞', price: 8500, image: 'https://images.unsplash.com/photo-1611039801831-28562d4e78a2?auto=format&fit=crop&q=80&w=800', category: '鍛造活塞', model: 'DRG 158 / MMBCU', stock: 0, sales: 85 },
          { id: 3, name: '秒殺起步 前普利盤套件', price: 4200, image: 'https://images.unsplash.com/photo-1589118949245-7d38baf380d6?auto=format&fit=crop&q=80&w=800', category: '前普利盤', model: 'KRV 180', stock: 20, sales: 310 },
          { id: 4, name: '暴力咬合 傳動離合器總成', price: 5800, image: 'https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&q=80&w=800', category: '傳動離合器', model: '全車系通用', stock: 5, sales: 240 }
        ];

        const App = () => {
          const [currentPage, setCurrentPage] = useState('home');
          const [categories, setCategories] = useState(INITIAL_CATEGORIES);
          const [products, setProducts] = useState(INITIAL_PRODUCTS);
          const [cart, setCart] = useState([]);
          const [isCartOpen, setIsCartOpen] = useState(false);
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [isAdminMode, setIsAdminMode] = useState(false);
          const [showLoginModal, setShowLoginModal] = useState(false);
          const [adminPassword, setAdminPassword] = useState('');
          const [showPassword, setShowPassword] = useState(false);
          const [newProduct, setNewProduct] = useState({ id: null, name: '', price: '', image: null, category: INITIAL_CATEGORIES[0], model: '', stock: 10 });
          const [isEditing, setIsEditing] = useState(false);
          const [newCategoryName, setNewCategoryName] = useState('');
          const [notifyProduct, setNotifyProduct] = useState(null);
          const [contactForm, setContactForm] = useState({ name: '', phone: '', email: '', message: '' });

          const stats = useMemo(() => {
            const currentMonthRevenue = products.reduce((acc, p) => acc + (p.price * Math.floor(p.sales * 0.1)), 0) + 1250000;
            const yearlyRevenue = products.reduce((acc, p) => acc + (p.price * p.sales), 0) + 15800000;
            return { currentMonthRevenue, yearlyRevenue };
          }, [products]);

          const handleLogin = () => {
            if (adminPassword === 'Aeon.1388') {
              setIsAdminMode(true);
              setShowLoginModal(false);
              setAdminPassword('');
            } else {
              alert('密碼錯誤！請重新輸入。');
            }
          };

          const addToCart = (product) => {
            setCart([...cart, { ...product, cartId: Date.now() }]);
            setIsCartOpen(true);
          };

          const removeFromCart = (cartId) => {
            setCart(cart.filter(item => item.cartId !== cartId));
          };

          const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              const imageUrl = URL.createObjectURL(file);
              setNewProduct({ ...newProduct, image: imageUrl });
            }
          };

          const saveProduct = () => {
            if (newProduct.name && newProduct.price && newProduct.image && newProduct.model) {
              if (isEditing) {
                setProducts(products.map(p => p.id === newProduct.id ? { ...newProduct, price: parseInt(newProduct.price), stock: parseInt(newProduct.stock) } : p));
              } else {
                setProducts([{ ...newProduct, id: Date.now(), price: parseInt(newProduct.price), stock: parseInt(newProduct.stock), sales: 0 }, ...products]);
              }
              resetForm();
            } else {
              alert('請填寫完整產品資訊');
            }
          };

          const resetForm = () => {
            setNewProduct({ id: null, name: '', price: '', image: null, category: categories[0], model: '', stock: 10 });
            setIsEditing(false);
          };

          const NavItem = ({ id, label }) => (
            <button 
              onClick={() => { setCurrentPage(id); setIsMenuOpen(false); window.scrollTo(0, 0); }}
              className={`px-4 py-2 text-sm md:text-base uppercase tracking-widest transition-all ${currentPage === id ? 'text-[#FFD700] font-bold' : 'text-gray-400 hover:text-white'}`}
            >
              {label}
            </button>
          );

          return (
            <div className="min-h-screen bg-[#0a0a0a] text-gray-100 font-sans selection:bg-[#FFD700] selection:text-black pb-safe">
              {/* 導航欄 */}
              <nav className="fixed top-0 w-full z-50 bg-black/90 backdrop-blur-md border-b border-white/10">
                <div className="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
                  <div className="flex items-center gap-4 cursor-pointer group" onClick={() => setCurrentPage('home')}>
                    <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" className="h-14 object-contain drop-shadow-[0_0_8px_rgba(255,215,0,0.5)] group-hover:scale-105 transition-transform" />
                    <div className="hidden sm:block">
                      <span className="text-2xl font-black tracking-widest bg-gradient-to-r from-yellow-500 to-yellow-200 bg-clip-text text-transparent">曜鈦精密科技</span>
                    </div>
                  </div>

                  <div className="hidden lg:flex items-center space-x-1">
                    <NavItem id="brand" label="霸主起源" />
                    <NavItem id="products" label="神級改裝品" />
                    <NavItem id="tech" label="黑科技支持" />
                    <NavItem id="contact" label="聯絡我們" />
                  </div>

                  <div className="flex items-center gap-4">
                    <button onClick={() => setIsCartOpen(true)} className="relative p-2 text-yellow-500"><ShoppingBag size={24} />{cart.length > 0 && <span className="absolute top-0 right-0 bg-red-600 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full">{cart.length}</span>}</button>
                    <button className="lg:hidden p-2 text-yellow-500" onClick={() => setIsMenuOpen(!isMenuOpen)}>{isMenuOpen ? <X size={28} /> : <Menu size={28} />}</button>
                  </div>
                </div>
              </nav>

              <main className="pt-24 min-h-[calc(100vh-400px)] text-center">
                {currentPage === 'home' && <HomeSection setCurrentPage={setCurrentPage} />}
                {currentPage === 'products' && (
                    <ProductsSection 
                        products={products} 
                        isAdminMode={isAdminMode} 
                        stats={stats} 
                        categories={categories}
                        newProduct={newProduct}
                        setNewProduct={setNewProduct}
                        saveProduct={saveProduct}
                        addToCart={addToCart}
                        setNotifyProduct={setNotifyProduct}
                    />
                )}
                {currentPage === 'brand' && <div className="py-20 text-4xl font-bold">霸主起源內容 (載入中...)</div>}
                {currentPage === 'tech' && <div className="py-20 text-4xl font-bold text-yellow-500">黑科技解析 (載入中...)</div>}
                {currentPage === 'contact' && <div className="py-20 text-4xl font-bold">聯絡我們 (載入中...)</div>}
              </main>

              {/* 登入 Modal */}
              {showLoginModal && (
                <div className="fixed inset-0 z-[110] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                  <div className="bg-neutral-900 border border-yellow-500/30 p-8 rounded-2xl w-full max-w-sm">
                    <h3 className="text-2xl font-black mb-6 text-center text-yellow-500">總裁專屬後台登入</h3>
                    <input type={showPassword ? "text" : "password"} value={adminPassword} onChange={(e) => setAdminPassword(e.target.value)} className="w-full bg-black border rounded-xl px-4 py-3 mb-6" placeholder="輸入密碼" />
                    <button onClick={handleLogin} className="w-full py-3 bg-yellow-600 text-black font-black rounded-xl">登入解鎖</button>
                    <button onClick={() => setShowLoginModal(false)} className="w-full mt-2 text-gray-500">取消</button>
                  </div>
                </div>
              )}

              {/* 購物車側欄 */}
              {isCartOpen && (
                <div className="fixed inset-0 z-[100] bg-black/60 flex justify-end">
                  <div className="w-full max-w-md bg-neutral-900 h-full p-8 border-l border-white/10 relative">
                    <button onClick={() => setIsCartOpen(false)} className="absolute top-6 right-6"><X /></button>
                    <h2 className="text-2xl font-bold mb-8 flex items-center gap-2"><ShoppingBag /> 購物車清單</h2>
                    <div className="space-y-4">
                        {cart.length === 0 ? <p>購物車目前空空如也</p> : cart.map(item => (
                            <div key={item.cartId} className="flex justify-between bg-white/5 p-4 rounded-xl">
                                <span>{item.name}</span>
                                <span className="text-yellow-500">NT$ {item.price.toLocaleString()}</span>
                            </div>
                        ))}
                    </div>
                  </div>
                </div>
              )}

              <footer className="bg-black py-10 mt-20 border-t border-white/10 text-center">
                <p className="text-gray-500">© 2026 曜鈦精密科技. All Rights Reserved.</p>
                <button onClick={() => setShowLoginModal(true)} className="mt-4 text-xs text-gray-700">管理員登入</button>
              </footer>
            </div>
          );
        };

        const HomeSection = ({ setCurrentPage }) => (
          <section className="animate-in py-20">
            <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" className="h-48 mx-auto mb-8 drop-shadow-[0_0_20px_rgba(255,215,0,0.4)]" />
            <h1 className="text-6xl font-black mb-8 leading-tight">動力解封<br /><span className="text-yellow-500">顛覆業界的極致效能</span></h1>
            <button onClick={() => setCurrentPage('products')} className="px-10 py-5 bg-yellow-600 text-black font-black text-lg rounded-full">解鎖神裝清單</button>
          </section>
        );

        const ProductsSection = (props) => (
          <section className="max-w-7xl mx-auto px-6 py-20 text-left">
            <h2 className="text-5xl font-black mb-12">神級改裝品清單</h2>
            
            {props.isAdminMode && (
                <div className="grid grid-cols-2 gap-6 mb-12">
                    <div className="bg-neutral-900 p-8 rounded-3xl border border-yellow-500/30">
                        <p className="text-gray-400">本月累積營收</p>
                        <p className="text-4xl font-black">NT$ {props.stats.currentMonthRevenue.toLocaleString()}</p>
                    </div>
                    <div className="bg-neutral-900 p-8 rounded-3xl border border-yellow-500/30">
                        <p className="text-gray-400">年度總計營收</p>
                        <p className="text-4xl font-black">NT$ {props.stats.yearlyRevenue.toLocaleString()}</p>
                    </div>
                </div>
            )}

            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
              {props.products.map(product => (
                <div key={product.id} className="bg-neutral-900 rounded-[2rem] overflow-hidden border border-white/10 group hover:border-yellow-500/50 transition-all">
                  <img src={product.image} className="w-full h-48 object-cover" />
                  <div className="p-8">
                    <h3 className="text-xl font-bold mb-2">{product.name}</h3>
                    <p className="text-yellow-500 font-bold text-2xl mb-6">NT$ {product.price.toLocaleString()}</p>
                    <button onClick={() => props.addToCart(product)} className="w-full py-4 bg-yellow-600 text-black font-black rounded-xl hover:bg-yellow-500">加入購物車</button>
                  </div>
                </div>
              ))}
            </div>
          </section>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
