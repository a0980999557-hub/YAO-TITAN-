<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAO-TITAN 曜鈦精密科技 | 動力解封</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0a0a0a; color: #f3f4f6; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .animate-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* 防止解析延遲黑屏 */
        #root:empty::before { content: '曜鈦動力 點火啟動中...'; color: #ca8a04; display: flex; justify-content: center; align-items: center; height: 100vh; font-weight: 900; letter-spacing: 0.3em; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 1. 對接 React Hooks 與 Lucide 圖示
        const { useState, useEffect, useMemo } = React;
        const { 
          ShoppingBag, Settings, Wrench, Mail, ChevronRight, 
          Plus, Trash2, Cpu, Zap, ShieldCheck, Menu, X, PlusCircle, 
          Camera, TrendingUp, Eye, EyeOff, Edit3, BarChart3, Bell, Phone 
        } = LucideReact;

        // 2. 原始數據設定
        const INITIAL_CATEGORIES = ['凸輪軸', '鍛造活塞', '前普利盤', '傳動離合器'];
        const INITIAL_PRODUCTS = [
          { id: 1, name: '賽道狂飆級 高角度凸輪軸', price: 12800, image: 'https://images.unsplash.com/photo-1558981403-c5f11bbdba27?auto=format&fit=crop&q=80&w=800', category: '凸輪軸', model: '勁戰六代 / 水冷BWS', stock: 15, sales: 128 },
          { id: 2, name: 'T6航太級 鍛造輕量活塞', price: 8500, image: 'https://images.unsplash.com/photo-1611039801831-28562d4e78a2?auto=format&fit=crop&q=80&w=800', category: '鍛造活塞', model: 'DRG 158 / MMBCU', stock: 0, sales: 85 },
          { id: 3, name: '秒殺起步 前普利盤套件', price: 4200, image: 'https://images.unsplash.com/photo-1589118949245-7d38baf380d6?auto=format&fit=crop&q=80&w=800', category: '前普利盤', model: 'KRV 180', stock: 20, sales: 310 },
          { id: 4, name: '暴力咬合 傳動離合器總成', price: 5800, image: 'https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&q=80&w=800', category: '傳動離合器', model: '全車系通用', stock: 5, sales: 240 }
        ];

        // 3. 主程式元件
        const App = () => {
          const [currentPage, setCurrentPage] = useState('home');
          const [categories, setCategories] = useState(INITIAL_CATEGORIES);
          const [products, setProducts] = useState(INITIAL_PRODUCTS);
          const [cart, setCart] = useState([]);
          const [isCartOpen, setIsCartOpen] = useState(false);
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [isAdminMode, setIsAdminMode] = useState(false);
          const [showLoginModal, setShowLoginModal] = useState(false);
          const [adminPassword, setAdminPassword] = useState('');
          const [showPassword, setShowPassword] = useState(false);
          const [newProduct, setNewProduct] = useState({ id: null, name: '', price: '', image: null, category: INITIAL_CATEGORIES[0], model: '', stock: 10 });
          const [isEditing, setIsEditing] = useState(false);
          const [newCategoryName, setNewCategoryName] = useState('');
          const [notifyProduct, setNotifyProduct] = useState(null);
          const [contactForm, setContactForm] = useState({ name: '', phone: '', email: '', message: '' });

          const stats = useMemo(() => {
            const currentMonthRevenue = products.reduce((acc, p) => acc + (p.price * Math.floor(p.sales * 0.1)), 0) + 1250000;
            const yearlyRevenue = products.reduce((acc, p) => acc + (p.price * p.sales), 0) + 15800000;
            return { currentMonthRevenue, yearlyRevenue };
          }, [products]);

          const handleLogin = () => {
            if (adminPassword === 'Aeon.1388') {
              setIsAdminMode(true);
              setShowLoginModal(false);
              setAdminPassword('');
            } else { alert('密碼錯誤！'); }
          };

          const addToCart = (product) => {
            setCart([...cart, { ...product, cartId: Date.now() }]);
            setIsCartOpen(true);
          };

          const removeFromCart = (cartId) => {
            setCart(cart.filter(item => item.cartId !== cartId));
          };

          const handleContactSubmit = (e) => {
            e.preventDefault();
            const subject = encodeURIComponent('曜鈦精密科技 官網線上詢問');
            const body = encodeURIComponent(`姓名: ${contactForm.name}\n電話: ${contactForm.phone}\nEmail: ${contactForm.email}\n\n需求內容:\n${contactForm.message}`);
            window.location.href = `mailto:yaotitascand@gmail.com?subject=${subject}&body=${body}`;
          };

          const handleNotifySubmit = (e) => {
            e.preventDefault();
            alert('已為您設定系統自動通知！補貨時將第一時間發信通知您。');
            setNotifyProduct(null);
          };

          // --- 內嵌子元件 (修正卡住的關鍵) ---
          
          const NavItem = ({ id, label }) => (
            <button onClick={() => { setCurrentPage(id); setIsMenuOpen(false); window.scrollTo(0, 0); }}
              className={`px-4 py-2 text-sm md:text-base uppercase tracking-widest transition-all ${currentPage === id ? 'text-[#FFD700] font-bold' : 'text-gray-400 hover:text-white'}`}>
              {label}
            </button>
          );

          const HomeSection = () => (
            <section className="relative overflow-hidden animate-in">
              <div className="max-w-7xl mx-auto px-6 py-24 md:py-32 flex flex-col items-center text-center">
                <div className="inline-flex items-center gap-2 px-5 py-2 bg-yellow-500/10 border border-yellow-500/30 rounded-full text-xs font-bold text-yellow-500 mb-8 tracking-widest uppercase"><Zap size={16} /> 賽道級黑科技全面釋放</div>
                <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" alt="Logo" className="h-32 md:h-48 mb-8 drop-shadow-[0_0_20px_rgba(255,215,0,0.4)]" />
                <h1 className="text-5xl md:text-7xl font-black tracking-tight mb-8 text-white leading-tight">動力解封 <br/><span className="bg-gradient-to-r from-yellow-500 to-yellow-200 bg-clip-text text-transparent">顛覆業界的極致效能</span></h1>
                <p className="text-lg md:text-xl text-gray-400 max-w-2xl mb-12 font-light">換上曜鈦精密，您的座駕就是公路上的<strong className="text-yellow-500">神級外掛</strong>。</p>
                <button onClick={() => setCurrentPage('products')} className="px-10 py-5 bg-yellow-600 text-black font-black text-lg rounded-full flex items-center gap-2 shadow-xl hover:scale-105 transition-all">解鎖神裝清單 <ChevronRight size={20} /></button>
              </div>
            </section>
          );

          const ProductsSection = () => {
            const [selectedCategory, setSelectedCategory] = useState('全部');
            const filteredProducts = selectedCategory === '全部' ? products : products.filter(p => p.category === selectedCategory);
            return (
              <section className="max-w-7xl mx-auto px-6 py-20 animate-in text-left">
                <h2 className="text-4xl md:text-5xl font-black mb-4 tracking-wider">神級改裝品清單</h2>
                {isAdminMode && (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-16">
                    <div className="bg-neutral-900 p-8 rounded-3xl border border-yellow-500/30 flex items-center gap-6"><div className="p-4 bg-yellow-500/10 text-yellow-500 rounded-2xl"><BarChart3 size={32}/></div><div><p className="text-gray-400 text-sm font-bold uppercase">本月累積營收</p><p className="text-4xl font-black text-white">NT$ {stats.currentMonthRevenue.toLocaleString()}</p></div></div>
                    <div className="bg-neutral-900 p-8 rounded-3xl border border-yellow-500/30 flex items-center gap-6"><div className="p-4 bg-yellow-500/10 text-yellow-500 rounded-2xl"><TrendingUp size={32}/></div><div><p className="text-gray-400 text-sm font-bold uppercase">年度總計營收</p><p className="text-4xl font-black text-white">NT$ {stats.yearlyRevenue.toLocaleString()}</p></div></div>
                  </div>
                )}
                <div className="flex flex-wrap gap-3 mb-10">
                  <button onClick={() => setSelectedCategory('全部')} className={`px-5 py-2 rounded-full font-bold border ${selectedCategory==='全部'?'bg-yellow-500 text-black':'text-gray-400 border-white/20'}`}>全部</button>
                  {categories.map(cat => (<button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-5 py-2 rounded-full font-bold border ${selectedCategory===cat?'bg-yellow-500 text-black':'text-gray-400 border-white/20'}`}>{cat}</button>))}
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                  {filteredProducts.map(p => (
                    <div key={p.id} className="group bg-neutral-900 border border-white/10 rounded-[2rem] overflow-hidden hover:border-yellow-500 transition-all flex flex-col h-full">
                      <div className="aspect-[4/3] relative overflow-hidden bg-black"><img src={p.image} className="w-full h-full object-cover group-hover:scale-110 transition-all duration-700" /><div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-end p-6 transition-opacity"><button onClick={() => p.stock > 0 ? addToCart(p) : setNotifyProduct(p)} className={`w-full py-4 rounded-xl font-black ${p.stock > 0 ? 'bg-yellow-500 text-black' : 'bg-red-600 text-white'}`}>{p.stock > 0 ? '加入購物車' : '缺貨通知'}</button></div></div>
                      <div className="p-8"><h3 className="font-bold text-xl mb-4 h-14">{p.name}</h3><p className="text-yellow-500 font-mono text-2xl font-black">NT$ {p.price.toLocaleString()}</p></div>
                    </div>
                  ))}
                </div>
              </section>
            );
          };

          return (
            <div className="min-h-screen">
              {/* 導航 */}
              <nav className="fixed top-0 w-full z-50 bg-black/90 backdrop-blur-md border-b border-white/10 h-24 flex items-center justify-between px-6">
                <div className="flex items-center gap-4 cursor-pointer" onClick={() => setCurrentPage('home')}>
                  <img src="https://i.postimg.cc/1tX4HVmJ/Chat-GPT-Image-2026nian4yue29ri-xia-wu11-18-56.png" className="h-14" />
                  <span className="text-2xl font-black tracking-widest bg-gradient-to-r from-yellow-500 to-yellow-200 bg-clip-text text-transparent hidden sm:block uppercase">曜鈦精密科技</span>
                </div>
                <div className="hidden lg:flex space-x-1">
                  <NavItem id="brand" label="霸主起源" /><NavItem id="products" label="神級改裝品" /><NavItem id="tech" label="黑科技支持" /><NavItem id="contact" label="聯絡我們" />
                </div>
                <div className="flex items-center gap-4">
                  <button onClick={() => setIsCartOpen(true)} className="relative p-2 text-yellow-500"><ShoppingBag size={24} />{cart.length > 0 && <span className="absolute top-0 right-0 bg-red-600 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-black">{cart.length}</span>}</button>
                  <button className="lg:hidden p-2 text-yellow-500" onClick={() => setIsMenuOpen(!isMenuOpen)}>{isMenuOpen ? <X size={28} /> : <Menu size={28} />}</button>
                </div>
              </nav>

              {/* 內容區 */}
              <main className="pt-24 min-h-screen">
                {currentPage === 'home' && <HomeSection />}
                {currentPage === 'products' && <ProductsSection />}
                {currentPage === 'brand' && <div className="py-40 text-center text-4xl font-bold titan-gradient">霸主起源 內容探索中...</div>}
                {currentPage === 'tech' && <div className="py-40 text-center text-4xl font-bold text-yellow-500">黑科技解析 準備中...</div>}
                {currentPage === 'contact' && (
                  <section className="max-w-4xl mx-auto px-6 py-20 text-left">
                    <h2 className="text-5xl font-black mb-12 italic">與我們聯繫</h2>
                    <form onSubmit={handleContactSubmit} className="space-y-6 bg-neutral-900 p-10 rounded-[2.5rem]">
                        <input required placeholder="姓名" value={contactForm.name} onChange={e => setContactForm({...contactForm, name: e.target.value})} className="w-full bg-black p-4 border border-white/10 rounded-xl" />
                        <input required placeholder="電話" value={contactForm.phone} onChange={e => setContactForm({...contactForm, phone: e.target.value})} className="w-full bg-black p-4 border border-white/10 rounded-xl" />
                        <textarea required placeholder="需求內容" value={contactForm.message} onChange={e => setContactForm({...contactForm, message: e.target.value})} rows="5" className="w-full bg-black p-4 border border-white/10 rounded-xl" />
                        <button className="w-full py-5 bg-yellow-600 text-black font-black rounded-xl text-lg">發送需求至曜鈦</button>
                    </form>
                  </section>
                )}
              </main>

              {/* 功能組件 */}
              {isCartOpen && (
                <div className="fixed inset-0 z-[100] bg-black/60 flex justify-end">
                  <div className="w-full max-w-md bg-neutral-900 h-full p-8 border-l border-yellow-600/20 flex flex-col">
                    <div className="flex justify-between items-center mb-8"><h2 className="text-2xl font-bold flex items-center gap-2 text-yellow-500"><ShoppingBag /> 購物袋</h2><button onClick={() => setIsCartOpen(false)}><X /></button></div>
                    <div className="flex-grow space-y-4 overflow-y-auto">
                        {cart.length === 0 ? <p className="text-center py-20 text-gray-500 uppercase font-black">Empty</p> : 
                            cart.map(i => (<div key={i.cartId} className="flex justify-between bg-black/40 p-4 rounded-xl items-center"><span>{i.name}</span><button onClick={() => removeFromCart(i.cartId)} className="text-red-500"><Trash2 size={18}/></button></div>))
                        }
                    </div>
                    <div className="pt-8 border-t border-white/10">
                        <div className="flex justify-between text-2xl font-black mb-6"><span>總計</span><span>NT$ {cart.reduce((s, i) => s + i.price, 0).toLocaleString()}</span></div>
                        <button className="w-full py-4 bg-yellow-600 text-black font-black rounded-xl">前往結帳</button>
                    </div>
                  </div>
                </div>
              )}

              {showLoginModal && (
                <div className="fixed inset-0 z-[110] bg-black/90 flex items-center justify-center p-4">
                  <div className="bg-neutral-900 p-8 rounded-3xl border border-yellow-500/30 w-full max-w-sm">
                    <h3 className="text-2xl font-black mb-6 text-yellow-500 text-center">總裁專屬登入</h3>
                    <input type="password" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} className="w-full bg-black p-4 border rounded-xl mb-6 outline-none focus:border-yellow-500" placeholder="請輸入密碼" />
                    <button onClick={handleLogin} className="w-full py-4 bg-yellow-600 text-black font-black rounded-xl">登入解鎖</button>
                    <button onClick={() => setShowLoginModal(false)} className="w-full mt-4 text-gray-600 text-sm">取消</button>
                  </div>
                </div>
              )}

              <footer className="bg-black py-20 border-t border-white/5 text-center px-10">
                  <p className="text-gray-600 text-xs tracking-widest uppercase">© 2026 YAO-TITAN PRECISION. All Rights Reserved.</p>
                  <button onClick={() => setShowLoginModal(true)} className="mt-6 text-yellow-900 font-bold italic opacity-30 hover:opacity-100">管理員登入系統</button>
              </footer>
            </div>
          );
        };

        // 4. 啟動引擎
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
