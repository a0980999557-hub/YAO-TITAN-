<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAO-TITAN 曜鈦精密科技 | 為極致性能而生</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #000; color: #fff; }
        .gold-glow { text-shadow: 0 0 20px rgba(202, 138, 4, 0.6); }
        .titan-gradient { background: linear-gradient(to bottom, #CA8A04, #A16207); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { ShoppingBag, Settings, Zap } = lucide;

        function App() {
            useEffect(() => { lucide.createIcons(); }, []);
            return (
                <div className="min-h-screen">
                    <nav class="fixed w-full z-50 bg-black/90 border-b border-yellow-600/30 px-8 py-5 flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="bg-yellow-600 p-1 rounded-sm"><Zap size={22} class="text-black fill-current" /></div>
                            <span class="text-xl font-black tracking-widest text-white uppercase">曜鈦精密科技</span>
                        </div>
                        <div class="hidden lg:flex space-x-12 text-sm font-bold tracking-[0.2em] text-gray-400">
                            <a href="#" class="hover:text-yellow-500">霸主起源</a>
                            <a href="#" class="hover:text-yellow-500">神級改裝品</a>
                            <a href="#" class="hover:text-yellow-500 text-yellow-600">管理戰情中心</a>
                        </div>
                        <div class="flex items-center space-x-6 text-yellow-600"><ShoppingBag size={24} /><Settings size={18} /></div>
                    </nav>

                    <header class="relative pt-64 pb-40 px-6 text-center">
                        <h2 class="text-lg md:text-xl font-bold tracking-[0.8em] text-yellow-600 mb-6 uppercase gold-glow">Precision Engineering</h2>
                        <h1 class="text-6xl md:text-9xl font-black mb-6 leading-tight">動力解封</h1>
                        <h1 class="text-4xl md:text-7xl font-black titan-gradient mb-12">顛覆業界的極致效能</h1>
                        <p class="text-lg md:text-xl text-gray-400 max-w-3xl mx-auto mb-16 leading-relaxed">
                            明明比誰都渴望速度，卻總是受限於原廠封印？<br/>
                            換上<span class="text-yellow-600 font-bold">曜鈦精密</span>，您的座駕就是公路上的神級外掛。
                        </p>
                        <button class="px-16 py-5 bg-yellow-600 text-black font-black text-xl tracking-widest hover:bg-yellow-500 transition-all shadow-[0_0_40px_rgba(202,138,4,0.4)]">賽道級黑科技全面開放</button>
                    </header>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
